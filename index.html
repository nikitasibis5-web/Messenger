<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Мессенджер | Киберфорс</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --bg: #f0f2f5; --surface: #ffffff; --text: #1a1a1a; --text-secondary: #888888; --primary: #4a7cfe; --border: #e0e0e0; --safe-bottom: env(safe-area-inset-bottom, 0px); }
    body.dark { --bg: #1a1a2e; --surface: #222222; --text: #eeeeee; --text-secondary: #aaaaaa; --primary: #4a7cfe; --border: #444444; }
    body.cyberforce { --bg: #020503; --surface: rgba(10,20,15,0.95); --text: #e2e8f0; --text-secondary: #94a3b8; --primary: #10b981; --border: rgba(16,185,129,0.3); font-family: 'Orbitron',sans-serif; letter-spacing: 0.5px; }
    body.cherry { --bg: #1a0a0a; --surface: #2d1111; --text: #f0d0d0; --text-secondary: #c09090; --primary: #e74c3c; --border: #5c2020; }
    body.ocean { --bg: #0a1a2a; --surface: #112233; --text: #d0e0f0; --text-secondary: #90b0c0; --primary: #3498db; --border: #204060; }
    body.caramel { --bg: #f5f0e8; --surface: #fff8f0; --text: #4a3020; --text-secondary: #8a7060; --primary: #c08050; --border: #d0c0b0; }
    body { font-family: 'Inter',sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; transition: background 0.3s, color 0.3s; overflow: hidden; position: relative; }
    .auth-screen { background: var(--surface); padding: 32px 24px; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); width: 100%; max-width: 400px; text-align: center; display: none; flex-direction: column; gap: 14px; backdrop-filter: blur(20px); border: 1px solid var(--border); z-index: 2; }
    .auth-screen.active { display: flex; }
    .auth-screen h2 { font-weight: 700; font-size: 1.8rem; background: linear-gradient(135deg, var(--primary), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
    .auth-screen input { width: 100%; padding: 16px; border: 1px solid var(--border); border-radius: 14px; font-size: 1rem; outline: none; background: var(--bg); color: var(--text); transition: border 0.2s; }
    .auth-screen input:focus { border-color: var(--primary); }
    .auth-screen button { width: 100%; padding: 16px; background: var(--primary); color: #fff; border: none; border-radius: 14px; font-weight: 700; font-size: 1rem; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: opacity 0.2s; }
    .auth-screen button:active { opacity: 0.8; }
    .auth-screen .toggle-text { font-size: 0.9rem; color: var(--text-secondary); }
    .auth-screen .toggle-text span { color: var(--primary); cursor: pointer; font-weight: 700; }
    .auth-error { color: #e74c3c; font-size: 0.85rem; min-height: 20px; }
    .app { width: 100%; height: 100vh; display: none; flex-direction: column; background: transparent; overflow: hidden; position: relative; z-index: 1; }
    .app.active { display: flex; }
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; z-index: 10; }
    .header h3 { font-weight: 700; font-size: 1.2rem; letter-spacing: 1px; flex-shrink: 0; white-space: nowrap; }
    .header-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .icon-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 12px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .icon-btn:active { background: var(--primary); color: #fff; }
    .logout-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: all 0.2s; }
    .logout-btn:active { background: var(--primary); color: #fff; }
    .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 5; }
    .tab { flex: 1; text-align: center; padding: 12px 8px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; font-size: 0.75rem; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 0; }
    .list-item { margin: 6px 12px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); transition: all 0.2s; }
    .list-item:active { border-color: var(--primary); transform: scale(0.98); }
    .avatar { width: 44px; height: 44px; border-radius: 14px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; flex-shrink: 0; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .item-info { flex: 1; min-width: 0; }
    .item-title { font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 4px; }
    .item-subtitle { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .group-badge { background: var(--primary); color: #fff; font-size: 0.6rem; padding: 2px 6px; border-radius: 8px; font-weight: 600; }
    .empty-state { padding: 60px 20px; text-align: center; color: var(--text-secondary); }
    .chat-panel { display: none; flex-direction: column; height: 100%; }
    .chat-panel.active { display: flex; }
    .chat-header { background: var(--surface); padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
    .back-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .call-btn { background: var(--primary); border: none; color: #fff; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; margin-left: auto; flex-shrink: 0; }
    .messages { flex: 1; padding: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 8px; }
    .msg-wrapper { position: relative; display: flex; animation: fadeIn 0.3s ease; }
    .msg-wrapper.sent { justify-content: flex-end; }
    .msg-wrapper.received { justify-content: flex-start; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
    .msg img, .msg video { max-width: 200px; max-height: 200px; border-radius: 10px; display: block; margin: 4px 0; }
    .msg.sent { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
    .msg.received { background: var(--surface); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
    .save-btn { position: absolute; top: -4px; right: -4px; background: var(--primary); color: #fff; border: none; width: 22px; height: 22px; border-radius: 50%; font-size: 0.7rem; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 10; }
    .msg-wrapper:active .save-btn, .msg-wrapper:hover .save-btn { display: flex; }
    .typing-indicator { font-size: 0.75rem; color: var(--text-secondary); padding: 2px 14px; font-style: italic; }
    .input-area { padding: 8px 12px; padding-bottom: calc(8px + var(--safe-bottom)); background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
    .input-area input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 0.9rem; outline: none; background: var(--bg); color: var(--text); }
    .input-area button { height: 38px; border-radius: 20px; border: none; background: var(--primary); color: #fff; font-size: 1rem; cursor: pointer; padding: 0 14px; white-space: nowrap; }
    .attach-btn { background: transparent; border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tools-panel { display: none; flex-wrap: wrap; gap: 6px; padding: 6px 12px; background: var(--surface); border-top: 1px solid var(--border); }
    .tools-panel.active { display: flex; }
    .tool-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 14px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s; white-space: nowrap; }
    .tool-btn:active { background: var(--primary); color: #fff; }
    .tool-btn.recording { background: #e74c3c; color: #fff; border-color: #e74c3c; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: 0.3s; }
    .modal.active { visibility: visible; opacity: 1; }
    .modal-content { background: var(--surface); padding: 24px; border-radius: 20px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; color: var(--text); border: 1px solid var(--border); }
    .modal-content h3 { margin-bottom: 14px; font-weight: 700; font-size: 1.1rem; }
    .modal-content input, .modal-content textarea { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid var(--border); border-radius: 12px; font-size: 0.9rem; background: var(--bg); color: var(--text); resize: vertical; }
    .modal-content button { width: 100%; padding: 12px; margin-top: 8px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
    .btn-secondary { background: var(--border) !important; color: var(--text) !important; }
    .theme-options { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-top: 8px; }
    .theme-opt { padding: 10px 4px; border-radius: 12px; border: 2px solid var(--border); cursor: pointer; text-align: center; font-weight: 600; font-size: 0.65rem; transition: all 0.3s; }
    .theme-opt.active { border-color: var(--primary); background: var(--bg); }
    .contact-checkbox { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 0.9rem; }
    .contact-checkbox input { width: auto; }
    @media (min-width: 768px) { .app { max-width: 500px; height: 90vh; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3); } .auth-screen { max-width: 420px; } }
  </style>
</head>
<body>

  <!-- Экран авторизации -->
  <div id="authScreen" class="auth-screen active">
    <h2 id="authTitle">Вход</h2>
    <input type="email" id="email" placeholder="Email" autocomplete="email">
    <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
    <div id="extraFields" style="display:none;">
      <input type="text" id="displayName" placeholder="Имя">
      <input type="tel" id="phone" placeholder="Телефон (только цифры)" pattern="[0-9]*" inputmode="numeric">
    </div>
    <div class="auth-error" id="authError"></div>
    <button id="authBtn" onclick="handleAuth()">Войти</button>
    <div class="toggle-text"><span onclick="toggleMode()">Нет аккаунта? Зарегистрироваться</span></div>
  </div>

  <!-- Основное приложение -->
  <div id="app" class="app">
    <div id="mainPanel">
      <div class="header">
        <h3>Сообщения</h3>
        <div class="header-btns">
          <button class="icon-btn" onclick="openCreateGroup()">👥</button>
          <button class="icon-btn" onclick="openSettings()">⚙️</button>
          <button class="icon-btn" onclick="openProfile()">👤</button>
          <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
      </div>
      <div class="tabs">
        <div class="tab active" onclick="switchTab('chats')">Чаты</div>
        <div class="tab" onclick="switchTab('contacts')">Контакты</div>
        <div class="tab" onclick="switchTab('system')">Системные</div>
      </div>
      <div id="chatList" class="list"></div>
      <div id="contactList" class="list" style="display:none;"></div>
      <div id="systemList" class="list" style="display:none;"></div>
    </div>
    <div id="chatPanel" class="chat-panel"></div>
  </div>

  <!-- Модальное окно: Добавить контакт -->
  <div id="addContactModal" class="modal">
    <div class="modal-content">
      <h3>Добавить контакт</h3>
      <div style="display:flex;gap:4px;margin-bottom:8px;">
        <select id="addCountryCode" style="padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text);">
          <option value="+7">+7</option><option value="+380">+380</option><option value="+375">+375</option>
          <option value="+1">+1</option><option value="+44">+44</option><option value="+49">+49</option><option value="+33">+33</option>
        </select>
        <input type="tel" id="addPhone" placeholder="Номер" style="flex:1;">
      </div>
      <button onclick="addContactByPhone()">Найти и добавить</button>
      <button class="btn-secondary" onclick="closeAddContact()" style="margin-top:6px;">Отмена</button>
    </div>
  </div>

  <!-- Модальное окно: Создать группу -->
  <div id="createGroupModal" class="modal">
    <div class="modal-content">
      <h3>Создать группу</h3>
      <input type="text" id="groupName" placeholder="Название группы">
      <div id="groupContacts" style="max-height:180px;overflow-y:auto;"></div>
      <button onclick="createGroup()">Создать</button>
      <button class="btn-secondary" onclick="closeCreateGroup()" style="margin-top:6px;">Отмена</button>
    </div>
  </div>

  <!-- Модальное окно: Редактировать группу -->
  <div id="editGroupModal" class="modal">
    <div class="modal-content">
      <h3>Редактировать группу</h3>
      <div style="width:70px;height:70px;border-radius:50%;margin:0 auto 12px;background:var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;" onclick="document.getElementById('groupAvatarInput').click()">
        <img id="groupAvatarPreview" src="" style="display:none;width:100%;height:100%;object-fit:cover;">
        <span id="groupAvatarPlaceholder" style="font-size:1.8rem;">📷</span>
      </div>
      <input type="file" id="groupAvatarInput" accept="image/*" style="display:none;" onchange="uploadGroupAvatar(event)">
      <input type="text" id="editGroupName" placeholder="Название группы">
      <textarea id="editGroupDesc" rows="3" placeholder="Описание группы"></textarea>
      <button onclick="saveGroupInfo()">Сохранить</button>
      <button class="btn-secondary" onclick="closeEditGroup()" style="margin-top:6px;">Отмена</button>
    </div>
  </div>

  <!-- Модальное окно: Отложенное сообщение -->
  <div id="scheduleModal" class="modal">
    <div class="modal-content">
      <h3>Отложенное сообщение</h3>
      <input type="text" id="scheduleText" placeholder="Текст сообщения">
      <input type="datetime-local" id="scheduleTime">
      <button onclick="sendScheduled()">Запланировать</button>
      <button class="btn-secondary" onclick="closeSchedule()" style="margin-top:6px;">Отмена</button>
    </div>
  </div>

  <!-- Модальное окно: Настройки -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h3>Настройки</h3>
      <p style="color:var(--text-secondary);margin-bottom:8px;">Тема оформления</p>
      <div class="theme-options">
        <div class="theme-opt active" onclick="setTheme('default')">☀️</div>
        <div class="theme-opt" onclick="setTheme('dark')">🌙</div>
        <div class="theme-opt" onclick="setTheme('cyberforce')">🌿</div>
        <div class="theme-opt" onclick="setTheme('cherry')">🍒</div>
        <div class="theme-opt" onclick="setTheme('ocean')">🌊</div>
        <div class="theme-opt" onclick="setTheme('caramel')">☕</div>
      </div>
      <button class="btn-secondary" onclick="closeSettings()" style="margin-top:16px;">Закрыть</button>
    </div>
  </div>

  <!-- Модальное окно: Профиль -->
  <div id="profileModal" class="modal">
    <div class="modal-content">
      <h3>Профиль</h3>
      <div style="width:70px;height:70px;border-radius:50%;margin:0 auto 12px;background:var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;" onclick="document.getElementById('avatarInput').click()">
        <img id="profileAvatar" src="" style="display:none;width:100%;height:100%;object-fit:cover;">
        <span id="avatarPlaceholder" style="font-size:1.8rem;">📷</span>
      </div>
      <input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="uploadAvatar(event)">
      <input type="text" id="profileName" placeholder="Имя">
      <textarea id="profileBio" rows="2" placeholder="О себе"></textarea>
      <div style="display:flex;align-items:center;gap:6px;margin:6px 0;">
        <span id="profilePhone" style="flex:1;padding:10px;background:var(--bg);border-radius:10px;font-size:0.9rem;"></span>
        <button class="btn-secondary" onclick="openChangePhone()" style="width:auto;padding:10px 14px;">Сменить</button>
      </div>
      <button onclick="saveProfile()">Сохранить</button>
      <button class="btn-secondary" onclick="closeProfile()" style="margin-top:6px;">Отмена</button>
    </div>
  </div>

  <!-- Модальное окно: Информация о пользователе -->
  <div id="userInfoModal" class="modal">
    <div class="modal-content" id="userInfoContent"></div>
  </div>

  <!-- Модальное окно: Смена номера -->
  <div id="changePhoneModal" class="modal">
    <div class="modal-content">
      <h3>Смена номера</h3>
      <p style="color:var(--text-secondary);font-size:0.85rem;margin-bottom:8px;">Код подтверждения отправлен в чат Verification</p>
      <input type="text" id="verificationCode" placeholder="Введите код из чата">
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button onclick="verifyCode()" style="flex:1;">Проверить</button>
        <button id="newCodeBtn" style="background:none;border:none;color:var(--primary);cursor:pointer;font-size:0.8rem;" onclick="requestNewCode()">Новый код</button>
      </div>
      <div id="timerText" style="font-size:0.8rem;color:var(--text-secondary);margin-top:4px;"></div>
      <div id="newPhoneSection" style="display:none;margin-top:12px;">
        <input type="tel" id="newPhone" placeholder="Новый номер">
        <button onclick="confirmNewPhone()" style="margin-top:8px;">Подтвердить</button>
      </div>
      <button class="btn-secondary" onclick="closeChangePhone()" style="margin-top:8px;">Отмена</button>
    </div>
  </div>

  <script>
    // ============ FIREBASE INIT ============
    firebase.initializeApp({
      apiKey: "AIzaSyBoKOLs5MwXYAjMkl3CtplfVE441IE3vEA",
      authDomain: "messenger-bcdd6.firebaseapp.com",
      projectId: "messenger-bcdd6",
      storageBucket: "messenger-bcdd6.firebasestorage.app",
      messagingSenderId: "974794455260",
      appId: "1:974794455260:web:c3367bc6e548718d871c19"
    });
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============ GLOBALS ============
    let currentUser = null;
    let currentUserProfile = null;
    let isLogin = true;
    let currentChat = null;
    let chatUnsubscribe = null;
    let chatListUnsubscribe = null;
    let verificationCode = null;
    let codeExpiry = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let typingTimeout = null;
    let chatTypingUnsubscribe = null;
    let editingGroupId = null;

    // WebRTC
    let localStream = null;
    let peerConnection = null;
    let callInProgress = false;
    let currentCallDocId = null;
    let callDocListener = null;

    const SYSTEM_BOTS = {
      'favorites-bot': { displayName: '⭐ Избранное', email: 'fav@sys', phone: '' },
      'verification-bot': { displayName: '🔐 Verification', email: 'ver@sys', phone: '' },
      'saved-bot': { displayName: '💾 Сохранённые', email: 'saved@sys', phone: '' }
    };
    const SYSTEM_IDS = Object.keys(SYSTEM_BOTS);
    const THEMES = ['default', 'dark', 'cyberforce', 'cherry', 'ocean', 'caramel'];

    // ============ THEMES ============
    function applyTheme(t) { document.body.classList.remove(...THEMES); if (t!=='default') document.body.classList.add(t); localStorage.setItem('theme',t); updateThemeUI(); }
    function updateThemeUI() { const current=localStorage.getItem('theme')||'default'; document.querySelectorAll('.theme-opt').forEach(o=>o.classList.remove('active')); const idx=THEMES.indexOf(current); if(idx>=0&&document.querySelectorAll('.theme-opt')[idx]) document.querySelectorAll('.theme-opt')[idx].classList.add('active'); }
    window.setTheme=t=>applyTheme(t);
    applyTheme(localStorage.getItem('theme')||'default');

    // ============ AUTH ============
    window.toggleMode = () => {
      isLogin = !isLogin;
      document.getElementById('authTitle').textContent = isLogin?'Вход':'Регистрация';
      document.getElementById('authBtn').textContent = isLogin?'Войти':'Зарегистрироваться';
      document.getElementById('extraFields').style.display = isLogin?'none':'block';
      document.getElementById('authError').textContent = '';
    };
    window.handleAuth = async () => {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();
      const name = document.getElementById('displayName').value.trim();
      const phone = document.getElementById('phone').value.trim();
      if (!email || !pass) { document.getElementById('authError').textContent = 'Заполните email и пароль'; return; }

    // ============ SYSTEM CHATS ============
    async function ensureSystemChats(uid) {

          await ref.set({ participants: [uid, botId], updatedAt: firebase.firestore.FieldValue.serverTimestamp() });

          if (botId === 'saved-bot') await ref.collection('messages').add({ senderId: botId, text: '💾 Здесь будут ваши сохранённые сообщения', timestamp: firebase.firestore.FieldValue.serverTimestamp() });

    }

    // ============ CONTACTS ============

    async function openChat(otherId, otherUser) {
      const chatId = [currentUser.uid, otherId].sort().join('_');
      await db.collection('chats').doc(chatId).set({ participants: [currentUser.uid, otherId], permanent: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      currentChat = { chatId, otherUser: { ...otherUser, id: otherId } };
      renderChat();
    }

    window.ensureChatPermanent = async (otherId) => {
      if (!currentUser || !otherId) return;
      const chatId = [currentUser.uid, otherId].sort().join('_');
      await db.collection('chats').doc(chatId).set({ participants: [currentUser.uid, otherId], permanent: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      alert('✅ Чат закреплён');
    };

    // ============ MESSAGE TOOLS ============
    window.toggleTools = () => { const p = document.getElementById('toolsPanel'); if (p) p.classList.toggle('active'); };
    window.toggleVoice = async () => {
      const btn = document.getElementById('voiceBtn');
      if (isRecording) {
        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        isRecording = false;
        if (btn) { btn.classList.remove('recording'); btn.innerHTML = '🎵'; }
      } else {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => { if (e.data.size>0) audioChunks.push(e.data); };
          mediaRecorder.onstop = async () => {
            const blob = new Blob(audioChunks, { type:'audio/webm' });
            if (blob.size > 0) {
              const reader = new FileReader();
              reader.onload = async (ev) => { if (currentChat) await db.collection('chats').doc(currentChat.chatId).collection('messages').add({ senderId:currentUser.uid, audio:ev.target.result, timestamp:firebase.firestore.FieldValue.serverTimestamp() }); };
              reader.readAsDataURL(blob);
            }
            stream.getTracks().forEach(t=>t.stop());
          };
          mediaRecorder.start();
          isRecording = true;
          if (btn) { btn.classList.add('recording'); btn.innerHTML = '🔴'; }
        } catch (e) { alert('Нет доступа к микрофону'); }
      }
    };
    window.sendMedia = () => document.getElementById('mediaInput').click();
    window.handleMedia = async (e) => {
      const file = e.target.files[0];
      if (!file || !currentChat) return;
      if (file.size > 5*1024*1024) { alert('Макс. 5MB'); return; }
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const isVideo = file.type.startsWith('video');
        await db.collection('chats').doc(currentChat.chatId).collection('messages').add({ senderId:currentUser.uid, [isVideo?'video':'image']:ev.target.result, timestamp:firebase.firestore.FieldValue.serverTimestamp() });
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    };
    window.openSchedule = () => document.getElementById('scheduleModal').classList.add('active');
    window.closeSchedule = () => document.getElementById('scheduleModal').classList.remove('active');
    window.sendScheduled = async () => {
      const text = document.getElementById('scheduleText').value.trim();
      const time = document.getElementById('scheduleTime').value;
      if (!text || !time || !currentChat) return alert('Заполните все поля');
      const st = new Date(time).getTime();
      if (st <= Date.now()) return alert('Время должно быть в будущем');
      setTimeout(async () => { await db.collection('chats').doc(currentChat.chatId).collection('messages').add({ senderId:currentUser.uid, text:`⏰ ${text}`, timestamp:firebase.firestore.FieldValue.serverTimestamp() }); }, st - Date.now());
      closeSchedule(); alert('Запланировано');
    };
    window.sendMsg = async (hidden=false) => {
      const input = document.getElementById('msgInput');
      if (!input) return;
      const text = input.value.trim();
      if (!text || !currentChat) return;
      const msgData = { senderId:currentUser.uid, text, timestamp:firebase.firestore.FieldValue.serverTimestamp() };
      if (hidden) msgData.hidden = true;
      await db.collection('chats').doc(currentChat.chatId).collection('messages').add(msgData);
      input.value = '';
    };
    window.handleTyping = () => {
      if (!currentChat) return;
      db.collection('chats').doc(currentChat.chatId).update({ [`typing.${currentUser.uid}`]: true });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { db.collection('chats').doc(currentChat.chatId).update({ [`typing.${currentUser.uid}`]: false }); }, 2000);
    };

    // ============ RENDER CHAT ============
    function renderChat() {
      if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
      if (chatTypingUnsubscribe) { chatTypingUnsubscribe(); chatTypingUnsubscribe = null; }
      clearTimeout(typingTimeout);
      if (mediaRecorder && isRecording) { mediaRecorder.stop(); isRecording = false; }
      const u = currentChat.otherUser;
      const otherId = currentChat.chatId.split('_').find(id=>id!==currentUser.uid);
      const isSystem = SYSTEM_IDS.includes(otherId) || (u&&u.isGroup);
      const isGroup = u&&u.isGroup;
      let readonly = false;
      if (isSystem && !isGroup) readonly = (otherId==='verification-bot' || otherId==='saved-bot');
      const canAdd = !isSystem && otherId && otherId!==currentUser.uid;
      document.getElementById('chatPanel').innerHTML = `
        <div class="chat-header">
          <button class="back-btn" onclick="closeChat()">←</button>
          <div class="avatar" ${isGroup?`onclick="openEditGroup('${currentChat.chatId}')" style="cursor:pointer;"`:''}>${u.groupAvatar?`<img src="${u.groupAvatar}">`:(u.photoURL?`<img src="${u.photoURL}">`:((u.displayName||'C').charAt(0)))}</div>
          <div style="font-weight:700;flex:1;${isGroup?'cursor:pointer;':''}" ${isGroup?`onclick="openEditGroup('${currentChat.chatId}')"`:''}>${u.displayName||'Чат'}${isGroup&&u.groupDesc?`<div style="font-size:0.7rem;font-weight:400;color:var(--text-secondary);">${u.groupDesc}</div>`:''}</div>
          ${canAdd?`<button class="icon-btn" onclick="ensureChatPermanent('${otherId}')" title="Добавить в контакты" style="margin-right:4px;">📌</button>`:''}
          ${isGroup?`<button class="icon-btn" onclick="openEditGroup('${currentChat.chatId}')" title="Настройки группы" style="margin-right:4px;">⚙️</button>`:''}
          ${!isSystem?'<button class="call-btn" onclick="window.startCall()">📞</button>':''}
        </div>
        <div class="messages" id="msgContainer"></div>
        <div class="typing-indicator" id="typingIndicator"></div>
        ${!readonly?`
          <div class="tools-panel" id="toolsPanel"><button class="tool-btn" id="voiceBtn" onclick="toggleVoice()">🎵</button><button class="tool-btn" onclick="openSchedule()">⏰</button><button class="tool-btn" onclick="sendMsg(true)">👻</button><button class="tool-btn" onclick="sendMedia()">📷</button></div>
          <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none" onchange="handleMedia(event)">
          <div class="input-area"><button class="attach-btn" onclick="toggleTools()">+</button><input id="msgInput" placeholder="Сообщение..." oninput="handleTyping()" onkeypress="if(event.key==='Enter')sendMsg(false)"><button onclick="sendMsg(false)">➤</button></div>
        `:'<div style="padding:14px;text-align:center;color:var(--text-secondary);">Чат только для чтения</div>'}
      `;
      document.getElementById('chatPanel').classList.add('active');
      document.getElementById('mainPanel').style.display = 'none';
      chatUnsubscribe = db.collection('chats').doc(currentChat.chatId).collection('messages').orderBy('timestamp','asc').onSnapshot(snap=>{
        const c = document.getElementById('msgContainer');
        if (!c) return;
        c.innerHTML = '';
        snap.forEach(doc=>{
          const m = doc.data();
          const isSent = m.senderId===currentUser.uid;
          let content = '';
          if (m.audio) content = `<div>🎵 <audio controls src="${m.audio}"></audio></div>`;
          else if (m.image) content = `<img src="${m.image}" style="max-width:200px;max-height:200px;border-radius:10px;">`;
          else if (m.video) content = `<video controls src="${m.video}" style="max-width:200px;max-height:200px;border-radius:10px;"></video>`;
          else content = m.text||'';
          c.innerHTML += `<div class="msg-wrapper ${isSent?'sent':'received'}"><div class="msg ${isSent?'sent':'received'}">${content}</div><button class="save-btn" onclick="event.stopPropagation();saveMessage('${doc.id}')">💾</button></div>`;
        });
        c.scrollTop = c.scrollHeight;
      });
      chatTypingUnsubscribe = db.collection('chats').doc(currentChat.chatId).onSnapshot(doc=>{
        const data = doc.data()?.typing||{};
        const typers = Object.keys(data).filter(uid=>uid!==currentUser.uid&&data[uid]);
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.textContent = typers.length>0?'печатает...':'';
      });
    }
    window.closeChat = () => {
      document.getElementById('chatPanel').classList.remove('active');
      document.getElementById('mainPanel').style.display = 'block';
      if (chatUnsubscribe) { chatUnsubscribe(); chatUnsubscribe = null; }
      if (chatTypingUnsubscribe) { chatTypingUnsubscribe(); chatTypingUnsubscribe = null; }
      clearTimeout(typingTimeout);
      if (mediaRecorder && isRecording) { mediaRecorder.stop(); isRecording = false; }
      currentChat = null;
      switchTab('chats');
    };
    window.saveMessage = async (msgId) => {
      if (!currentChat) return;
      const msgDoc = await db.collection('chats').doc(currentChat.chatId).collection('messages').doc(msgId).get();
      if (msgDoc.exists) {
        const sc = [currentUser.uid,'saved-bot'].sort().join('_');
        await db.collection('chats').doc(sc).set({ participants:[currentUser.uid,'saved-bot'], updatedAt:firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
        const d = msgDoc.data();
        let t = '📌 ';
        if (d.audio) t += '[Голосовое]'; else if (d.image) t += '[Фото]'; else if (d.video) t += '[Видео]'; else t += d.text||'';
        await db.collection('chats').doc(sc).collection('messages').add({ senderId:currentUser.uid, text:t, timestamp:firebase.firestore.FieldValue.serverTimestamp() });
        alert('Сохранено');
      }
    };

    // ============ CHAT LIST ============
    async function loadAllChats() {
      const snap = await db.collection('chats').where('participants','array-contains',currentUser.uid).get();
      await renderChatList(snap);
    }
    async function renderChatList(snap) {
      const items = [];
      for (const doc of snap.docs) {
        const data = doc.data();
        if (data.isGroup) {
          let lastMsg = '';
          try { const msgs = await db.collection('chats').doc(doc.id).collection('messages').orderBy('timestamp','desc').limit(1).get(); if (!msgs.empty) { const d = msgs.docs[0].data(); lastMsg = d.audio?'[Голосовое]':d.image?'[Фото]':d.video?'[Видео]':(d.text||''); } } catch(e){}
          items.push({ chatId:doc.id, user:{ displayName:data.groupName||'Группа', isGroup:true, groupDesc:data.groupDesc||'', groupAvatar:data.groupAvatar||'' }, lastMsg });
          continue;
        }
        const otherId = data.participants.find(id=>id!==currentUser.uid);
        if (!otherId || SYSTEM_IDS.includes(otherId)) continue;
        let userData = { displayName:'Контакт', email:'', phone:'' };
        try { const userDoc = await db.collection('users').doc(otherId).get(); if (userDoc.exists) userData = userDoc.data(); else userData.displayName = 'Пользователь '+otherId.substring(0,8); } catch(e){}
        let lastMsg = '';
        try { const msgs = await db.collection('chats').doc(doc.id).collection('messages').orderBy('timestamp','desc').limit(1).get(); if (!msgs.empty) { const d = msgs.docs[0].data(); lastMsg = d.audio?'[Голосовое]':d.image?'[Фото]':d.video?'[Видео]':(d.text||''); } } catch(e){}
        items.push({ chatId:doc.id, user:userData, lastMsg });
      }
      items.sort((a,b)=>(a.user.displayName||'').localeCompare(b.user.displayName||''));
      const list = document.getElementById('chatList');
      if (!list) return;
      list.innerHTML = items.length ? '' : '<div class="empty-state">Нет чатов</div>';
      items.forEach(item=>{
        const div = document.createElement('div'); div.className='list-item';
        div.innerHTML = `<div class="avatar">${item.user.groupAvatar?`<img src="${item.user.groupAvatar}">`:(item.user.photoURL?`<img src="${item.user.photoURL}">`:((item.user.displayName||'?').charAt(0)))}</div><div class="item-info"><div class="item-title">${item.user.displayName||'Контакт'}${item.user.isGroup?' <span class="group-badge">группа</span>':''}</div><div class="item-subtitle">${item.lastMsg||(item.user.groupDesc||'Начните общение')}</div></div>`;
        div.onclick = () => { currentChat = { chatId:item.chatId, otherUser:item.user }; renderChat(); };
        list.appendChild(div);
      });
    }
    function listenChats() {
      if (chatListUnsubscribe) chatListUnsubscribe();
      loadAllChats();
      chatListUnsubscribe = db.collection('chats').where('participants','array-contains',currentUser.uid).onSnapshot(async snap=>await renderChatList(snap));
    }

    window.switchTab = (tab) => {
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.getElementById('chatList').style.display = 'none';
      document.getElementById('contactList').style.display = 'none';
      document.getElementById('systemList').style.display = 'none';
      if (tab==='chats') { document.querySelector('.tab:nth-child(1)').classList.add('active'); document.getElementById('chatList').style.display='block'; }
      else if (tab==='contacts') { document.querySelector('.tab:nth-child(2)').classList.add('active'); document.getElementById('contactList').style.display='block'; loadContacts(); }
      else { document.querySelector('.tab:nth-child(3)').classList.add('active'); document.getElementById('systemList').style.display='block'; loadSystemList(); }
    };

    // ============ PROFILE ============
    window.openProfile = () => {
      document.getElementById('profileName').value = currentUserProfile?.displayName||'';
      document.getElementById('profileBio').value = currentUserProfile?.bio||'';
      document.getElementById('profilePhone').textContent = currentUserProfile?.phone||'Не указан';
      const a = document.getElementById('profileAvatar'), p = document.getElementById('avatarPlaceholder');
      if (currentUserProfile?.photoURL) { a.src = currentUserProfile.photoURL; a.style.display='block'; p.style.display='none'; }
      else { a.style.display='none'; p.style.display='flex'; }
      document.getElementById('profileModal').classList.add('active');
    };
    window.closeProfile = () => document.getElementById('profileModal').classList.remove('active');
    window.uploadAvatar = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 2*1024*1024) { alert('Макс. 2MB'); return; }
      const reader = new FileReader();
      reader.onload = async (ev) => {
        const base64 = ev.target.result;
        await db.collection('users').doc(currentUser.uid).update({ photoURL: base64 });
        currentUserProfile.photoURL = base64;
        document.getElementById('profileAvatar').src = base64;
        document.getElementById('profileAvatar').style.display = 'block';
        document.getElementById('avatarPlaceholder').style.display = 'none';
      };
      reader.readAsDataURL(file);
    };
    window.saveProfile = async () => {
      const n = document.getElementById('profileName').value.trim();
      const b = document.getElementById('profileBio').value.trim();
      if (!n) return alert('Введите имя');
      await db.collection('users').doc(currentUser.uid).update({ displayName: n, bio: b });
      currentUserProfile.displayName = n; currentUserProfile.bio = b;
      closeProfile();
    };

    // ============ CHANGE PHONE ============
    let timerInterval = null;
    function updateTimer() {
      const btn = document.getElementById('newCodeBtn'), t = document.getElementById('timerText');
      if (!codeExpiry) { t.textContent=''; if(btn) btn.disabled=false; if(timerInterval) clearInterval(timerInterval); return; }
      const rem = Math.max(0, Math.ceil((codeExpiry-Date.now())/1000));
      if (rem<=0) { t.textContent=''; if(btn) btn.disabled=false; codeExpiry=null; if(timerInterval) clearInterval(timerInterval); }
      else { t.textContent = `Новый код через ${rem} сек.`; if(btn) btn.disabled=true; if(!timerInterval) timerInterval = setInterval(()=>updateTimer(),1000); }
    }
    window.openChangePhone = async () => {
      document.getElementById('changePhoneModal').classList.add('active');
      document.getElementById('newPhoneSection').style.display = 'none';
      document.getElementById('verificationCode').value = '';
      document.getElementById('verificationCode').disabled = false;
      updateTimer();
      if (!verificationCode || !codeExpiry || Date.now()>=codeExpiry) await sendVerificationCode();
    };
    async function sendVerificationCode() {
      verificationCode = Math.floor(100000+Math.random()*900000).toString();
      codeExpiry = Date.now()+60000;
      updateTimer();
      const botId='verification-bot', chatId=[currentUser.uid,botId].sort().join('_');
      await db.collection('users').doc(botId).set({ displayName:'🔐 Verification', email:'ver@sys' }, { merge:true });
      await db.collection('chats').doc(chatId).set({ participants:[currentUser.uid,botId], updatedAt:firebase.firestore.FieldValue.serverTimestamp() }, { merge:true });
      await db.collection('chats').doc(chatId).collection('messages').add({ senderId:botId, text:`Ваш код подтверждения: ${verificationCode}`, timestamp:firebase.firestore.FieldValue.serverTimestamp() });
      currentChat = { chatId, otherUser:{ displayName:'🔐 Verification', email:'ver@sys' } };
      renderChat();
    }
    window.requestNewCode = () => { if (!codeExpiry || Date.now()>=codeExpiry) sendVerificationCode(); };
    window.closeChangePhone = () => { document.getElementById('changePhoneModal').classList.remove('active'); if(timerInterval) clearInterval(timerInterval); };
    window.verifyCode = () => {
      if (document.getElementById('verificationCode').value.trim()===verificationCode) {
        document.getElementById('newPhoneSection').style.display = 'block';
        document.getElementById('verificationCode').disabled = true;
      } else alert('Неверный код');
    };
    window.confirmNewPhone = async () => {
      const phone = document.getElementById('newPhone').value.trim();
      if (!phone) return alert('Введите номер');
      await db.collection('users').doc(currentUser.uid).update({ phone });
      currentUserProfile.phone = phone;
      document.getElementById('profilePhone').textContent = phone;
      document.getElementById('changePhoneModal').classList.remove('active');
      if (timerInterval) clearInterval(timerInterval);
    };

    window.openSettings = () => { updateThemeUI(); document.getElementById('settingsModal').classList.add('active'); };
    window.closeSettings = () => document.getElementById('settingsModal').classList.remove('active');
    document.querySelectorAll('.modal').forEach(modal=>modal.addEventListener('click',function(e){ if(e.target===this) this.classList.remove('active'); }));

    // ============ WEBRTC CALLS ============
    window.startCall = async () => {
      if (!currentChat || callInProgress) return;
      if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
        alert('❌ Звонки работают только по HTTPS. Откройте сайт через https://...');
        return;
      }
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio:true, video:true });
        callInProgress = true;
        const callDocRef = db.collection('calls').doc();
        currentCallDocId = callDocRef.id;
        await callDocRef.set({
          chatId: currentChat.chatId,
          participants: [currentUser.uid, currentChat.otherUser.id],
          callerId: currentUser.uid,
          status: 'ringing',
          offer: null, answer: null, candidates: [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        await createPeerConnection();
        localStream.getTracks().forEach(track=>peerConnection.addTrack(track,localStream));
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        await callDocRef.update({ offer: JSON.stringify(offer) });
        listenCallDoc(callDocRef);
        showCallUI();
      } catch (e) {
        console.error(e);
        if (e.name==='NotAllowedError') alert('⛔ Доступ к камере/микрофону запрещён. Разрешите в настройках браузера и обновите страницу.');
        else if (e.name==='NotFoundError') alert('📷 Не найдена камера или микрофон.');
        else alert('❌ Ошибка: '+e.message);
        endCall();
      }
    };
    async function createPeerConnection() {
      peerConnection = new RTCPeerConnection({ iceServers:[{ urls:'stun:stun.l.google.com:19302' }] });
      peerConnection.ontrack = (event) => {
        const remoteVideo = document.getElementById('remoteVideo');
        if (remoteVideo && event.streams[0]) remoteVideo.srcObject = event.streams[0];
      };
      peerConnection.onicecandidate = (event) => {
        if (event.candidate && currentCallDocId) {
          db.collection('calls').doc(currentCallDocId).update({ candidates: firebase.firestore.FieldValue.arrayUnion(JSON.stringify(event.candidate)) });
        }
      };
      peerConnection.oniceconnectionstatechange = () => {
        if (peerConnection && (peerConnection.iceConnectionState==='disconnected'||peerConnection.iceConnectionState==='failed')) endCall();
      };
    }
    function listenCallDoc(callDocRef) {
      if (callDocListener) callDocListener();
      callDocListener = callDocRef.onSnapshot(async (doc) => {
        if (!doc.exists) { endCall(); return; }
        const data = doc.data();
        if (data.status==='ended') { endCall(); return; }
        if (data.callerId===currentUser.uid && data.answer && peerConnection && peerConnection.signalingState!=='stable') {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(data.answer)));
        }
        if (data.candidates && peerConnection) {
          for (const candStr of data.candidates) {
            try { await peerConnection.addIceCandidate(new RTCIceCandidate(JSON.parse(candStr))); } catch(e){}
          }
        }
      });
    }
    function listenForIncomingCalls() {
      db.collection('calls').where('participants','array-contains',currentUser.uid).where('status','==','ringing').onSnapshot(async(snap)=>{
        for (const change of snap.docChanges()) {
          if (change.type==='added') {
            const doc = change.doc, data = doc.data();
            if (data.callerId===currentUser.uid) continue;
            if (callInProgress) { await doc.ref.update({ status:'ended' }); continue; }
            if (confirm(`📞 Входящий звонок от ${data.callerId.substring(0,6)}... Принять?`)) await acceptCall(doc);
            else await doc.ref.update({ status:'ended' });
          }
        }
      });
    }
    async function acceptCall(callDoc) {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio:true, video:true });
        callInProgress = true;
        currentCallDocId = callDoc.id;
        const data = callDoc.data();
        await createPeerConnection();
        localStream.getTracks().forEach(track=>peerConnection.addTrack(track,localStream));
        await peerConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(data.offer)));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        await callDoc.ref.update({ answer:JSON.stringify(answer), status:'active' });
        listenCallDoc(callDoc.ref);
        showCallUI();
      } catch(e) { console.error(e); endCall(); }
    }
    window.endCall = () => {
      if (currentCallDocId) db.collection('calls').doc(currentCallDocId).update({ status:'ended' }).catch(()=>{});
      if (localStream) { localStream.getTracks().forEach(t=>t.stop()); localStream = null; }
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (callDocListener) { callDocListener(); callDocListener = null; }
      callInProgress = false; currentCallDocId = null;
      closeCallUI();
    };
    function showCallUI() {
      const existing = document.getElementById('callModal');
      if (existing) existing.remove();
      const modal = document.createElement('div'); modal.id='callModal';
      modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;';
      modal.innerHTML = `<video id="localVideo" autoplay muted playsinline style="position:absolute;top:20px;right:20px;width:120px;height:160px;border-radius:12px;object-fit:cover;border:2px solid #fff;z-index:2;"></video><video id="remoteVideo" autoplay playsinline style="width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;"></video><div style="position:absolute;bottom:40px;z-index:2;"><button onclick="window.endCall()" style="width:70px;height:70px;border-radius:50%;background:#e74c3c;color:#fff;border:none;font-size:2rem;cursor:pointer;">📞</button></div>`;
      document.body.appendChild(modal);
      const localVideo = document.getElementById('localVideo');
      if (localVideo && localStream) localVideo.srcObject = localStream;
    }
    function closeCallUI() { const modal = document.getElementById('callModal'); if (modal) modal.remove(); }

    console.log('Мессенджер готов.');
  </script>
</body>
</html>
