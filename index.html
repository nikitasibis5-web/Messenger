<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CyberForce">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22CyberForce%22%2C%22short_name%22%3A%22CyberForce%22%2C%22start_url%22%3A%22.%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230a0a0f%22%2C%22theme_color%22%3A%22%236c5ce7%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg' viewBox%3D'0 0 100 100'%253E%253Ctext y%3D'.9em' font-size%3D'90'%253E⚡%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22100x100%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
  <title>CyberForce Messenger</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0a0a0f; --surface: #13131a; --surface2: #1a1a24;
      --text: #e8e8f0; --text-secondary: #8888a0;
      --primary: #6c5ce7; --primary-light: #a29bfe; --primary-dark: #4a3db5;
      --accent: #00d2ff; --accent2: #7c3aed;
      --danger: #ff4757; --success: #2ed573; --warning: #ffa502;
      --border: rgba(255,255,255,0.06); --glass: rgba(255,255,255,0.03);
      --glow: 0 0 20px rgba(108,92,231,0.3);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --radius: 16px; --radius-sm: 10px; --radius-lg: 24px;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; align-items: center;
      justify-content: center; overflow: hidden; position: relative;
    }
    .bg-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.4; }
    .bg-particle { position: absolute; border-radius: 50%; background: var(--primary); filter: blur(60px); animation: floatParticle 8s ease-in-out infinite; }
    @keyframes floatParticle { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(30px,-50px) scale(1.3); } 66% { transform: translate(-20px,30px) scale(0.8); } }
    .bg-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.03; background-image: linear-gradient(rgba(255,255,255,0.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.1) 1px,transparent 1px); background-size: 40px 40px; }
    .hearts-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; display: none; }
    .heart-particle { position: absolute; color: #ff0000; opacity: 0; font-size: 20px; animation: floatUp linear infinite; }
    @keyframes floatUp { 0% { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.6; } 100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; } }

    .auth-screen { background: var(--surface); backdrop-filter: blur(20px); padding: 40px 32px; border-radius: var(--radius-lg); box-shadow: 0 20px 60px rgba(0,0,0,0.5),var(--glow); width: 100%; max-width: 420px; text-align: center; display: none; flex-direction: column; gap: 20px; z-index: 2; border: 1px solid var(--border); position: relative; overflow: hidden; }
    .auth-screen::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle,rgba(108,92,231,0.1) 0%,transparent 70%); animation: rotateBg 10s linear infinite; }
    @keyframes rotateBg { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .auth-screen.active { display: flex; }
    .auth-screen h2 { font-weight: 800; font-size: 2rem; background: linear-gradient(135deg,var(--primary),var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; position: relative; z-index: 1; }
    .auth-screen .subtitle { font-size: 0.9rem; color: var(--text-secondary); position: relative; z-index: 1; margin-top: -12px; }
    .auth-screen input { width: 100%; padding: 16px 20px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 1rem; outline: none; background: var(--surface2); color: var(--text); transition: all 0.3s; position: relative; z-index: 1; }
    .auth-screen input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108,92,231,0.1); }
    .auth-screen .phone-input-group { display: flex; gap: 0; position: relative; z-index: 1; }
    .auth-screen .phone-prefix { padding: 16px 14px; background: var(--surface2); border: 1px solid var(--border); border-right: none; border-radius: var(--radius) 0 0 var(--radius); color: var(--text-secondary); font-weight: 600; font-size: 1rem; display: flex; align-items: center; white-space: nowrap; }
    .auth-screen .phone-input { flex: 1; padding: 16px 20px; border: 1px solid var(--border); border-radius: 0 var(--radius) var(--radius) 0; font-size: 1rem; outline: none; background: var(--surface2); color: var(--text); }
    .auth-screen .phone-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108,92,231,0.1); }
    .auth-screen button { width: 100%; padding: 16px; background: linear-gradient(135deg,var(--primary),var(--accent2)); color: #fff; border: none; border-radius: var(--radius); font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.3s; position: relative; z-index: 1; box-shadow: 0 4px 15px rgba(108,92,231,0.4); }
    .auth-screen button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(108,92,231,0.6); }
    .auth-screen .toggle-text { font-size: 0.9rem; color: var(--text-secondary); position: relative; z-index: 1; }
    .auth-screen .toggle-text span { color: var(--accent); cursor: pointer; font-weight: 600; }
    .auth-error { color: var(--danger); font-size: 0.85rem; min-height: 20px; position: relative; z-index: 1; }
    .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
    .loading-overlay.active { display: flex; }
    .loading-spinner { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--text); font-weight: 600; }

    .install-banner { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 20px; z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.5); align-items: center; gap: 12px; color: var(--text); }
    .install-banner.show { display: flex; }
    .install-banner button { padding: 10px 20px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; }

    .app { width: 100%; height: 100vh; display: none; flex-direction: column; background: transparent; overflow: hidden; position: relative; z-index: 1; }
    .app.active { display: flex; }
    #mainPanel { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .header { background: var(--glass); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 8px; z-index: 10; }
    .header h3 { font-weight: 800; font-size: 1.3rem; background: linear-gradient(135deg,var(--primary-light),var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; flex-shrink: 0; }
    .header-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .icon-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: var(--radius-sm); cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .icon-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: var(--glow); }
    .logout-btn { background: rgba(255,71,87,0.1); border: 1px solid rgba(255,71,87,0.3); color: var(--danger); padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .logout-btn:hover { background: var(--danger); color: #fff; }
    .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 5; padding: 0 8px; }
    .tab { flex: 1; text-align: center; padding: 14px 6px; font-weight: 600; cursor: pointer; color: var(--text-secondary); font-size: 0.85rem; transition: all 0.3s; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--primary-light); border-bottom-color: var(--primary); }
    .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 0; scroll-behavior: smooth; }
    .list-item { margin: 6px 16px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; border: 1px solid var(--border); border-radius: var(--radius); background: var(--glass); backdrop-filter: blur(10px); transition: all 0.2s; }
    .list-item:hover { border-color: var(--primary); background: rgba(108,92,231,0.05); box-shadow: 0 4px 20px rgba(0,0,0,0.3); transform: translateY(-1px); }
    .list-item.highlight { border-color: var(--primary); box-shadow: 0 0 20px rgba(108,92,231,0.5); }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg,var(--primary),var(--accent2)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; flex-shrink: 0; overflow: hidden; position: relative; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .online-dot { position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface); }
    .online-dot.online { background: var(--success); box-shadow: 0 0 8px rgba(46,213,115,0.6); }
    .item-info { flex: 1; min-width: 0; }
    .item-title { font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
    .item-subtitle { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .group-badge { background: var(--primary); color: #fff; font-size: 0.65rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .bot-badge { background: var(--accent); color: #000; font-size: 0.65rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .empty-state { padding: 80px 20px; text-align: center; color: var(--text-secondary); }
    .stories-container { display: flex; gap: 12px; padding: 12px 20px; overflow-x: auto; background: var(--glass); border-bottom: 1px solid var(--border); scroll-behavior: smooth; flex-shrink: 0; }
    .story-circle { width: 62px; height: 62px; border-radius: 50%; background: linear-gradient(135deg,var(--primary),var(--accent),var(--accent2)); padding: 2px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .story-circle-inner { width: 100%; height: 100%; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; overflow: hidden; font-weight: 700; font-size: 1.3rem; }
    .story-circle-inner img,.story-circle-inner video { width: 100%; height: 100%; object-fit: cover; }
    .chat-panel { display: none; flex-direction: column; height: 100%; background: transparent; }
    .chat-panel.active { display: flex; }
    .chat-header { background: var(--glass); backdrop-filter: blur(20px); padding: 12px 20px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); }
    .back-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: var(--radius-sm); cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
    .back-btn:hover { background: var(--primary); color: #fff; }
    .call-btn { background: var(--success); border: none; color: #fff; width: 34px; height: 34px; border-radius: var(--radius-sm); cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; margin-left: auto; box-shadow: 0 4px 15px rgba(46,213,115,0.4); }
    .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
    .msg-wrapper { position: relative; display: flex; }
    .msg-wrapper.sent { justify-content: flex-end; } .msg-wrapper.received { justify-content: flex-start; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: var(--radius); font-size: 0.9rem; line-height: 1.5; word-break: break-word; }
    .msg.sent { background: linear-gradient(135deg,var(--primary),var(--accent2)); color: #fff; border-bottom-right-radius: 4px; }
    .msg.received { background: var(--surface2); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
    .msg img,.msg video { max-width: 200px; max-height: 200px; border-radius: var(--radius-sm); display: block; margin: 4px 0; }
    .msg .file-attachment { display: flex; align-items: center; gap: 8px; padding: 8px; background: rgba(255,255,255,0.05); border-radius: var(--radius-sm); margin-top: 4px; cursor: pointer; }
    .msg .file-attachment:hover { background: rgba(255,255,255,0.1); }
    .input-area { padding: 12px 16px; padding-bottom: calc(12px + var(--safe-bottom)); background: var(--glass); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
    .input-area input { flex: 1; padding: 12px 18px; border: 1px solid var(--border); border-radius: 25px; font-size: 0.9rem; outline: none; background: var(--surface2); color: var(--text); }
    .input-area input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108,92,231,0.1); }
    .input-area button { height: 40px; border-radius: 25px; border: none; background: linear-gradient(135deg,var(--primary),var(--accent2)); color: #fff; font-size: 1rem; cursor: pointer; padding: 0 20px; font-weight: 700; }
    .attach-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .tools-panel { display: none; flex-wrap: wrap; gap: 8px; padding: 10px 16px; background: var(--glass); border-top: 1px solid var(--border); }
    .tools-panel.active { display: flex; }
    .tool-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .tool-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    .tool-btn.recording { background: var(--danger); color: #fff; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .upload-progress { padding: 8px 16px; background: var(--surface2); border-top: 1px solid var(--border); display: none; align-items: center; gap: 12px; }
    .upload-progress.active { display: flex; }
    .progress-bar { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.2s; }
    .upload-progress span { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; }

    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: 0.3s; backdrop-filter: blur(5px); }
    .modal.active { visibility: visible; opacity: 1; }
    .modal-content { background: var(--surface); padding: 28px; border-radius: var(--radius-lg); width: 90%; max-width: 420px; max-height: 85vh; overflow-y: auto; color: var(--text); border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.5),var(--glow); position: relative; }
    .modal-content h3 { margin-bottom: 18px; font-weight: 700; font-size: 1.2rem; background: linear-gradient(135deg,var(--primary-light),var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .modal-content input,.modal-content textarea,.modal-content select { width: 100%; padding: 14px 16px; margin: 8px 0; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; background: var(--surface2); color: var(--text); resize: vertical; }
    .modal-content input:focus,.modal-content textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108,92,231,0.1); }
    .modal-content button { width: 100%; padding: 14px; margin-top: 10px; background: linear-gradient(135deg,var(--primary),var(--accent2)); color: #fff; border: none; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; }
    .btn-secondary { background: var(--surface2) !important; color: var(--text) !important; box-shadow: none !important; border: 1px solid var(--border) !important; }
    .btn-danger { background: var(--danger) !important; }

    .theme-options { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-top: 14px; }
    .theme-opt { padding: 14px 6px; border-radius: var(--radius-sm); border: 2px solid var(--border); cursor: pointer; text-align: center; font-weight: 600; font-size: 0.7rem; }
    .theme-opt.active { border-color: var(--primary); box-shadow: var(--glow); }

    .call-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg,#0a0a1a,#0f0f2e,#1a1040,#0a0a1a); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse-ring { 0% { transform: scale(0.95); opacity: 0.7; box-shadow: 0 0 40px rgba(108,92,231,0.4); } 50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 80px rgba(108,92,231,0.8); } 100% { transform: scale(0.95); opacity: 0.7; box-shadow: 0 0 40px rgba(108,92,231,0.4); } }
    .call-avatar-ring { width: 130px; height: 130px; border-radius: 50%; background: linear-gradient(135deg,var(--primary),var(--accent)); display: flex; align-items: center; justify-content: center; font-size: 3.5rem; font-weight: 800; margin-bottom: 20px; animation: pulse-ring 2s infinite; overflow: hidden; border: 4px solid rgba(255,255,255,0.1); }
    .call-avatar-ring img { width: 100%; height: 100%; object-fit: cover; }
    .call-name { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
    .call-status { font-size: 1rem; color: rgba(255,255,255,0.6); margin-bottom: 20px; letter-spacing: 2px; }
    .call-timer { font-size: 1.4rem; font-weight: 600; color: rgba(255,255,255,0.9); margin-bottom: 20px; font-variant-numeric: tabular-nums; }
    .call-participants { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .call-participant { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.9rem; border: 2px solid rgba(255,255,255,0.2); }
    .call-invite-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: 600; margin-bottom: 20px; font-size: 0.9rem; transition: all 0.2s; }
    .call-invite-btn:hover { background: rgba(255,255,255,0.2); }
    .call-actions { display: flex; gap: 24px; align-items: center; }
    .call-btn-circle { width: 64px; height: 64px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.5rem; transition: all 0.2s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    .call-btn-circle:active { transform: scale(0.9); }
    .call-btn-mute { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
    .call-btn-mute.muted { background: var(--danger); border-color: var(--danger); }
    .call-btn-end { width: 76px; height: 76px; background: var(--danger); color: white; animation: ripple 2s infinite; }
    @keyframes ripple { 0% { box-shadow: 0 0 0 0 rgba(255,71,87,0.6); } 100% { box-shadow: 0 0 0 40px rgba(255,71,87,0); } }
    .call-btn-speaker { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
    .call-btn-speaker.muted { background: var(--danger); border-color: var(--danger); }

    @media (min-width: 768px) { .app { max-width: 520px; height: 92vh; border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 0 60px rgba(108,92,231,0.2),0 0 0 1px var(--border); } }
  </style>
</head>
<body>
<div class="bg-particles" id="bgParticles"></div>
<div class="bg-grid"></div>
<div class="hearts-bg" id="heartsBg"></div>

<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">Загрузка...</div>
</div>

<div id="installBanner" class="install-banner">
  <span>📱 Установить как приложение</span>
  <button onclick="installApp()">Установить</button>
</div>

<div id="authScreen" class="auth-screen active">

    function applyTheme(themeName) {
        var theme = THEME_PRESETS.find(function (t) { return t.name === themeName; }) || THEME_PRESETS[0];
        var root = document.documentElement;
        root.style.setProperty('--bg', theme.bg);
        root.style.setProperty('--surface', theme.surface);
        root.style.setProperty('--surface2', theme.surface2);
        root.style.setProperty('--text', theme.text);
        root.style.setProperty('--text-secondary', theme.textSecondary);
        root.style.setProperty('--primary', theme.primary);
        root.style.setProperty('--primary-light', theme.primaryLight);
        root.style.setProperty('--accent', theme.accent);
        root.style.setProperty('--accent2', theme.accent2);
        root.style.setProperty('--border', theme.border);
        document.body.style.background = theme.bg;
        document.body.style.fontFamily = theme.font || 'Inter, sans-serif';
        localStorage.setItem('theme', themeName);
        if (theme.hearts) startHearts(); else stopHearts();
        updateThemeUI();

    function validateInternationalPhone(phone) {
        if (!phone.startsWith('+')) return null;
        var digits = phone.slice(1).replace(/\D/g, '');
        if (digits.length < 7 || digits.length > 15) return null;
        return '+' + digits;
    }

    window.handleAuth = async function () {
        if (!navigator.onLine) {
            document.getElementById('authError').textContent = 'Нет подключения к интернету';
            return;
        }
        showLoading(isLogin ? 'Вход...' : 'Регистрация...');

        var password = document.getElementById('password').value.trim();

        var countryCode = document.getElementById('countryCode') ? document.getElementById('countryCode').value : '+7';
        var phoneRaw = document.getElementById('phone') ? document.getElementById('phone').value.trim() : '';
        var errorElement = document.getElementById('authError');

        if (!email || !password) {
            errorElement.textContent = 'Заполните email и пароль';
            hideLoading();
            return;
        }

        if (!isLogin) {
            if (!displayName) {
                errorElement.textContent = 'Введите имя';
                hideLoading();
                return;
            }
            if (!phoneRaw) {
                errorElement.textContent = 'Введите номер телефона';
                hideLoading();
                return;
            }
            var fullPhone = countryCode + phoneRaw;
            var validatedPhone = validateInternationalPhone(fullPhone);
            if (!validatedPhone) {
                errorElement.textContent = 'Неверный формат номера. Должно быть +[код страны]XXXXXXXXX';
                hideLoading();
                return;
            }
            try {
                var existingUsers = await db.collection('users').where('phone', '==', validatedPhone).get();

                    return;

                hideLoading();

        } else if (message.poll) {
            var poll = message.poll;
            content = '<div style="font-weight:600;">📊 ' + poll.question + '</div><div class="poll-options">';
            poll.options.forEach(function (option, index) {
                var totalVotes = poll.totalVotes || 1;

                content += '<div class="poll-option" onclick="votePoll(\'' + docId + '\',' + index + ')">' + option.text + '<span style="font-size:0.8rem;">' + option.votes.length + ' голосов (' + percent + '%)</span><div class="bar" style="width:' + percent + '%"></div></div>';
            });
            content += '</div>';
        } else if (message.invite) {
            var invite = message.invite;
            content = '<div style="font-weight:600;">📨 Приглашение</div><div>' + (invite.text || 'Вас приглашают вступить') + '</div>';

            else if (invite.declined) content += '<div style="color:var(--danger);font-weight:600;">Вы отклонили приглашение</div>';
        } else content = message.text || '';
        if (message.edited) content += '<span class="msg-edited"> изм.</span>';
        return content;
    }

        } else {
            try {
                var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = function (event) { if (event.data.size > 0) audioChunks.push(event.data); };
                mediaRecorder.onstop = async function () {
                    var blob = new Blob(audioChunks, { type: 'audio/webm' });
                    if (blob.size > 0) {
                        var reader = new FileReader();
                        reader.onload = async function (event) { if (currentChat) await db.collection('chats').doc(currentChat.chatId).collection('messages').add({ senderId: currentUser.uid, audio: event.target.result, timestamp: firebase.firestore.FieldValue.serverTimestamp() }); };
                        reader.readAsDataURL(blob);
                    }
                    stream.getTracks().forEach(t => t.stop());
                    updateQuest('voice1');
                };
                mediaRecorder.start();
                isRecording = true;
                if (btn) { btn.classList.add('recording'); btn.innerHTML = '🔴'; }

    async function loadStories() {

        chatsSnap.forEach(function (doc) { doc.data().participants.forEach(function (id) { if (id !== currentUser.uid && !SYSTEM_IDS.includes(id)) userIds.add(id); }); });
        for (let uid of userIds) {
            let storiesSnap = await db.collection('users').doc(uid).collection('stories').where('expiresAt', '>', new Date()).orderBy('createdAt', 'desc').limit(1).get();
            if (!storiesSnap.empty) {
                let userDoc = await db.collection('users').doc(uid).get();
                let u = userDoc.exists ? userDoc.data() : { displayName: uid.substring(0, 8) };
                let allStories = [];
                let allSnap = await db.collection('users').doc(uid).collection('stories').where('expiresAt', '>', new Date()).orderBy('createdAt', 'asc').get();
                allSnap.forEach(function (doc) { allStories.push({ id: doc.id, mediaUrl: doc.data().mediaUrl, mediaType: doc.data().mediaType, caption: doc.data().caption }); });
                let circle = document.createElement('div');

        if (!currentStories.length || currentStoryIndex >= currentStories.length) { closeStory(); return; }
        var story = currentStories[currentStoryIndex];
        var img = document.getElementById('storyImage'), vid = document.getElementById('storyVideo');
        if (story.mediaType === 'video') { img.style.display = 'none'; vid.style.display = 'block'; vid.src = story.mediaUrl; vid.play(); }
        else { vid.style.display = 'none'; img.style.display = 'block'; img.src = story.mediaUrl; }
        document.getElementById('storyCaption').textContent = story.caption || '';
        var progress = document.getElementById('storyProgress');
        progress.style.transition = 'none'; progress.style.width = '0%';
        var duration = story.mediaType === 'video' ? 15000 : 5000;
        setTimeout(function () { progress.style.transition = 'width ' + (duration / 1000) + 's linear'; progress.style.width = '100%'; }, 50);
        if (storyInterval) clearTimeout(storyInterval);
        storyInterval = setTimeout(function () { currentStoryIndex++; showCurrentStory(); }, duration);
    }
    window.closeStory = function () { document.getElementById('storyViewer').classList.remove('active'); var vid = document.getElementById('storyVideo'); vid.pause(); vid.src = ''; if (storyInterval) clearTimeout(storyInterval); currentStories = []; currentStoryIndex = 0; };
    async function cleanOldStories() { var snap = await db.collection('users').doc(currentUser.uid).collection('stories').where('expiresAt', '<', new Date()).get(); snap.forEach(async doc => await doc.ref.delete()); }

    async function updateQuest(questId) {
        if (!currentUser) return;
        var ref = db.collection('users').doc(currentUser.uid);
        var doc = await ref.get();
        var quests = doc.data()?.quests || {};
        var quest = QUESTS.find(q => q.id === questId);
        if (!quest) return;
        var count = (quests[questId] || 0) + 1;
        quests[questId] = count;
        await ref.update({ quests });
        if (count >= quest.target && !(doc.data()?.completedQuests || []).includes(questId)) {
            var completed = doc.data()?.completedQuests || [];
            if (!completed.includes(questId)) {
                completed.push(questId);
                await ref.update({ completedQuests: completed, xp: firebase.firestore.FieldValue.increment(quest.xp) });
                addXP(quest.xp);
                alert('✅ Задание выполнено: ' + quest.desc + ' (+' + quest.xp + ' XP)');
            }
        }
    }

    async function addXP(amount) {
        if (!currentUser) return;
        var ref = db.collection('users').doc(currentUser.uid);
        var doc = await ref.get();
        var xp = (doc.data()?.xp || 0) + amount;
        var level = doc.data()?.level || 0;
        var nextXP = (level + 1) * 100;
        if (xp >= nextXP) { xp -= nextXP; level++; await ref.update({ xp: xp, level: level }); alert('🎉 Новый уровень ' + level + '!'); }
        else await ref.update({ xp: xp });
    }

    window.openLevels = async function () {
        var doc = await db.collection('users').doc(currentUser.uid).get();
        var data = doc.data() || { level: 0, xp: 0, quests: {}, completedQuests: [] };
        var level = data.level, xp = data.xp, nextXP = (level + 1) * 100, progress = Math.min(100, (xp / nextXP) * 100);
        var questsProgress = QUESTS.map(q => {
            var cur = data.quests?.[q.id] || 0;
            var done = (data.completedQuests || []).includes(q.id);
            return { id: q.id, desc: q.desc, target: q.target, xp: q.xp, cur: cur, done: done };
        });
        document.getElementById('levelsContent').innerHTML = '<h3>🏆 Уровень ' + level + '</h3><div class="progress-bar" style="height:10px;margin:10px 0;"><div class="progress-bar-fill" style="width:' + progress + '%;background:var(--primary);"></div></div><p style="font-size:0.8rem;">' + xp + '/' + nextXP + ' XP</p><h4 style="margin-top:16px;">📋 Задания</h4><div style="max-height:200px;overflow-y:auto;">' + questsProgress.map(q => '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);"><span>' + q.desc + ' ' + (q.done ? '✅' : '(' + q.cur + '/' + q.target + ')') + '</span><span style="color:var(--accent);">+' + q.xp + ' XP</span></div>').join('') + '</div><button class="btn-secondary" onclick="document.getElementById(\'levelsModal\').classList.remove(\'active\')">Закрыть</button>';
        document.getElementById('levelsModal').classList.add('active');
    };

    window.importContacts = async function () {
        if (!('contacts' in navigator)) { alert('Импорт контактов не поддерживается'); return; }
        try {
            var contacts = await navigator.contacts.select(['name', 'tel'], { multiple: true });
            if (!contacts.length) return;
            for (var contact of contacts) {
                if (contact.tel && contact.tel.length) {
                    var phone = contact.tel[0].replace(/[\s\-\(\)]/g, '');
                    if (phone) {
                        var validated = validateInternationalPhone(phone.startsWith('+') ? phone : '+' + phone);
                        if (!validated) continue;
                        var exist = await db.collection('users').where('phone', '==', validated).get();
                        if (!exist.empty) {
                            for (var doc of exist.docs) {
                                if (doc.id !== currentUser.uid) {
                                    var chatId = [currentUser.uid, doc.id].sort().join('_');
                                    await db.collection('chats').doc(chatId).set({ participants: [currentUser.uid, doc.id], permanent: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
                                }
                            }
                            alert('Контакт ' + (contact.name || '') + ' добавлен');
                        } else alert('Пользователь с номером ' + validated + ' не найден');
                    }
                }
            }
            loadAllChats();
        } catch (e) { console.error(e); }
    };

    async function joinCall(callId) {
        endCall();
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            callInProgress = true; currentCallDocId = callId;
            var callRef = db.collection('calls').doc(callId); var data = (await callRef.get()).data();
            if ((data.participants || []).length >= 6) { alert('Звонок заполнен'); endCall(); return; }
            await callRef.update({ participants: firebase.firestore.FieldValue.arrayUnion(currentUser.uid), status: 'active' });
            var pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            peerConnections = [pc];
            localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
            pc.ontrack = e => { setupRemoteAudio(e.streams[0]); };
            pc.onicecandidate = e => { if (e.candidate) callRef.update({ candidates: firebase.firestore.FieldValue.arrayUnion(JSON.stringify(e.candidate)) }); };
            pc.onconnectionstatechange = function () {
                var statusEl = document.getElementById('callStatus');
                if (statusEl) statusEl.textContent = { 'connecting': 'Подключение...', 'connected': '✅ Соединение установлено', 'disconnected': '⚠️ Разрыв', 'failed': '❌ Ошибка', 'closed': 'Завершён' }[pc.connectionState] || pc.connectionState;
                if (pc.connectionState === 'failed' || pc.connectionState === 'closed') endCall();
            };
            if (data.offer) {
                await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(data.offer)));
                var ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
                await callRef.update({ answer: JSON.stringify(ans) });
            }
            listenCallDoc(callRef); showCallUI(data.participants || []);
            _callTimeout = setTimeout(() => { if (callInProgress && pc.connectionState !== 'connected') { alert('Не удалось установить соединение.'); endCall(); } }, 25000);
        } catch (e) { endCall(); }
    }

    function setupRemoteAudio(stream) {
        var exist = document.getElementById('remoteAudio'); if (exist) exist.remove();
        var a = document.createElement('audio'); a.id = 'remoteAudio'; a.autoplay = true; a.playsinline = true; a.srcObject = stream;
        a.play().catch(() => {});
        var modal = document.getElementById('callModal'); if (modal) modal.appendChild(a);
    }

    function listenCallDoc(ref) {
        if (callDocListener) callDocListener();
        callDocListener = ref.onSnapshot(async doc => {
            if (!doc.exists) { endCall(); return; }
            var data = doc.data(); if (data.status === 'ended') { endCall(); return; }
            updateCallParticipants(data.participants || []);
            if (data.answer && peerConnections[0] && data.callerId !== currentUser.uid) {
                try { if (!peerConnections[0].remoteDescription) await peerConnections[0].setRemoteDescription(new RTCSessionDescription(JSON.parse(data.answer))); } catch (e) {}
            }
            if (data.candidates && peerConnections[0]?.remoteDescription) {
                for (var c of data.candidates) { try { await peerConnections[0].addIceCandidate(new RTCIceCandidate(JSON.parse(c))); } catch (e) {} }
            }
        });
    }

    window.endCall = function () {
        if (_callTimeout) { clearTimeout(_callTimeout); _callTimeout = null; }
        if (currentCallDocId) db.collection('calls').doc(currentCallDocId).update({ status: 'ended' }).catch(() => {});
        if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
        peerConnections.forEach(pc => pc.close()); peerConnections = [];
        if (callDocListener) { callDocListener(); callDocListener = null; }
        callInProgress = false; currentCallDocId = null; closeCallUI();
    };

    function showCallUI(participants) {
        closeCallUI();
        var name = currentChat?.otherUser?.displayName || 'Звонок';
        var modal = document.createElement('div'); modal.id = 'callModal'; modal.className = 'call-modal';
        modal.innerHTML = '<div class="call-avatar-ring">' + name.charAt(0).toUpperCase() + '</div><div class="call-name">' + name + '</div><div class="call-status" id="callStatus">Подключение...</div><div class="call-timer" id="callTimer" style="display:none;">00:00</div><div class="call-participants" id="callParticipants">' + (participants || []).slice(0, 6).map(() => '<div class="call-participant">👤</div>').join('') + '</div><button class="call-invite-btn" onclick="copyCallLink()">🔗 Копировать ссылку</button><div class="call-actions"><button class="call-btn-circle call-btn-mute" id="muteMicBtn" onclick="toggleMic()">🎙️</button><button class="call-btn-circle call-btn-end" onclick="window.endCall()">📞</button><button class="call-btn-circle call-btn-speaker" id="muteSpeakerBtn" onclick="toggleSpeaker()">🔊</button></div>';
        document.body.appendChild(modal); callStartTime = Date.now(); callTimerInterval = setInterval(updateCallTimer, 1000);
    }

    function updateCallParticipants(participants) { var c = document.getElementById('callParticipants'); if (c) c.innerHTML = participants.slice(0, 6).map(() => '<div class="call-participant">👤</div>').join(''); }

    function updateCallTimer() {
        var t = document.getElementById('callTimer'), s = document.getElementById('callStatus');
        if (!t || !s) return;
        if (peerConnections[0]?.connectionState === 'connected') {
            t.style.display = 'block'; s.style.display = 'none';
            var elapsed = Math.floor((Date.now() - callStartTime) / 1000);
            t.textContent = Math.floor(elapsed / 60).toString().padStart(2, '0') + ':' + (elapsed % 60).toString().padStart(2, '0');
        }
    }

    window.copyCallLink = function () {
        if (!currentCallDocId) return;
        var link = getCallInviteLink(currentCallDocId);
        navigator.clipboard.writeText(link).then(() => alert('Ссылка скопирована!')).catch(() => prompt('Ссылка:', link));
    };

    window.toggleMic = function () {
        _micMuted = !_micMuted;
        if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !_micMuted);
        var b = document.getElementById('muteMicBtn');
        if (b) { b.classList.toggle('muted', _micMuted); b.textContent = _micMuted ? '🔇' : '🎙️'; }
    };

    window.toggleSpeaker = function () {
        _speakerMuted = !_speakerMuted;
        var a = document.getElementById('remoteAudio'); if (a) a.muted = _speakerMuted;
        var b = document.getElementById('muteSpeakerBtn');
        if (b) { b.classList.toggle('muted', _speakerMuted); b.textContent = _speakerMuted ? '🔇' : '🔊'; }
    };

    function closeCallUI() {
        var m = document.getElementById('callModal'); if (m) m.remove();
        var n = document.getElementById('incomingCallNotification'); if (n) n.remove();
        var a = document.getElementById('remoteAudio'); if (a) a.remove();
        if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
    }

    function checkCallLink() {
        var params = new URLSearchParams(location.search);
        var callId = params.get('call');
        if (callId && currentUser) {
            if (confirm('Присоединиться к звонку?')) joinCall(callId);
            history.replaceState({}, '', location.pathname);
        }
    }

    window.openChangePhone = function () { document.getElementById('changePhoneModal').classList.add('active'); };
    window.closeChangePhone = function () { document.getElementById('changePhoneModal').classList.remove('active'); };
    window.verifyCode = function () { alert('Функция в разработке'); };
    window.requestNewCode = function () { alert('Новый код отправлен'); };
    window.confirmNewPhone = async function () {
        var code = document.getElementById('newCountryCode').value;
        var phone = code + document.getElementById('newPhone').value.trim();
        if (!phone || phone === code) return alert('Введите номер');
        var validated = validateInternationalPhone(phone);
        if (!validated) return alert('Неверный формат');
        await db.collection('users').doc(currentUser.uid).update({ phone: validated });
        currentUserProfile.phone = validated;
        document.getElementById('profilePhone').textContent = validated;
        closeChangePhone();
    };

    auth.onAuthStateChanged(async function (user) {
        if (user) {
            showLoading('Загрузка профиля...');
            currentUser = user;
            var userDoc = await db.collection('users').doc(user.uid).get();
            if (userDoc.exists) currentUserProfile = userDoc.data();
            else currentUserProfile = { displayName: user.email.split('@')[0], bio: '', photoURL: '', mode: 'online', level: 0, xp: 0, blocked: [], quests: {}, completedQuests: [] };
            await ensureSystemChats(user.uid);
            document.getElementById('authScreen').classList.remove('active');
            document.getElementById('app').classList.add('active');
            startPresence();
            loadStories();
            cleanOldStories();
            loadSystemList();
            listenChats();
            listenForIncomingCalls();
            setupTestBotCallHandler();
            checkCallLink();
            hideLoading();
        } else {
            currentUser = null;
            document.getElementById('authScreen').classList.add('active');
            document.getElementById('app').classList.remove('active');
            document.getElementById('chatPanel').innerHTML = '';
            document.getElementById('chatPanel').classList.remove('active');
            stopPresence();
            endCall();
            hideLoading();
        }
    });

    window.addEventListener('load', function () {
        var requiredFunctions = [
            'handleAuth', 'logout', 'toggleMode', 'installApp', 'setTheme',
            'sendMsg', 'handleTyping', 'toggleTools', 'sendMedia', 'sendFile',
            'toggleVoice', 'handleMedia', 'handleFile', 'cancelUpload',
            'showMsgContext', 'deleteMsg', 'showUserInfo', 'toggleBlockUser',
            'openCreateStory', 'closeStory', 'openLevels', 'importContacts',
            'openCreateGroup', 'closeCreateGroup', 'createGroup',
            'openCreateChannel', 'closeCreateChannel', 'createChannel',
            'openEditGroup', 'closeEditGroup', 'saveGroupInfo',
            'openChannelSettings', 'saveChannelInfo', 'deleteChannel', 'leaveChannel',
            'uploadChannelAvatar', 'uploadGroupAvatar', 'viewComments', 'sendComment',
            'openPoll', 'closePoll', 'addPollOption', 'removePollOption',
            'createPoll', 'votePoll', 'acceptInvite', 'declineInvite',
            'startCall', 'endCall', 'copyCallLink', 'toggleMic', 'toggleSpeaker',
            'openProfile', 'closeProfile', 'uploadAvatar', 'saveProfile',
            'openSettings', 'closeSettings', 'switchTab',
            'openChangePhone', 'closeChangePhone', 'verifyCode', 'requestNewCode', 'confirmNewPhone',
            'showChatContext', 'deleteChat', 'deleteGroupForAll', 'deleteGroupForMe', 'deleteChannelForAll', 'deleteChannelForMe',
            'searchByPhone'
        ];
        var missingFunctions = [];
        requiredFunctions.forEach(function (funcName) {
            if (typeof window[funcName] !== 'function') {
                missingFunctions.push(funcName);
            }
        });
        if (missingFunctions.length > 0) {
            document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--danger);font-size:1.2rem;padding:20px;text-align:center;"><div>⚠️ Код не дописан!<br>Отсутствуют функции: ' + missingFunctions.join(', ') + '</div></div>';
        }
    });
</script>
</body>
</html>
