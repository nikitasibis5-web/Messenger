<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberForce Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e8e8f0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.3;
        }
        .bg-particle {
            position: absolute;
            border-radius: 50%;
            background: #6c5ce7;
            filter: blur(60px);
            animation: floatParticle 8s ease-in-out infinite;
        }
        @keyframes floatParticle {
            0%,100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(30px,-50px) scale(1.3); }
            66% { transform: translate(-20px,30px) scale(0.8); }
        }
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .auth-screen {
            background: #13131a;
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 20px rgba(108,92,231,0.3);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
            position: relative;
            z-index: 1;
        }
        .auth-screen h2 {
            font-weight: 800;
            font-size: 2rem;
            background: linear-gradient(135deg, #6c5ce7, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #8888a0;
            margin: 8px 0 20px;
        }
        .auth-screen input {
            width: 100%;
            padding: 16px 20px;
            margin: 8px 0;
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            background: #1a1a24;
            color: #e8e8f0;
            transition: all 0.3s;
        }
        .auth-screen input:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 4px rgba(108,92,231,0.1);
        }
        .auth-screen input::placeholder {
            color: #444;
        }
        .auth-screen button {
            width: 100%;
            padding: 16px;
            margin-top: 12px;
            background: linear-gradient(135deg, #6c5ce7, #7c3aed);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(108,92,231,0.4);
        }
        .auth-screen button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108,92,231,0.6);
        }
        .auth-screen button:active {
            transform: scale(0.95);
        }
        .toggle-text {
            font-size: 0.9rem;
            color: #8888a0;
            margin-top: 16px;
        }
        .toggle-text span {
            color: #00d2ff;
            cursor: pointer;
            font-weight: 600;
        }
        .toggle-text span:hover {
            text-decoration: underline;
        }

        /* ТОСТ (уведомление) */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #0a0a1a, #1a1040);
            color: #fff;
            padding: 16px 28px;
            border-radius: 16px;
            font-size: 0.95rem;
            z-index: 99999;
            box-shadow: 0 8px 40px rgba(108,92,231,0.4);
            border: 1px solid rgba(108,92,231,0.3);
            text-align: center;
            max-width: 92%;
            backdrop-filter: blur(12px);
            animation: slideUpTech 0.5s ease-out;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        @keyframes slideUpTech {
            from { opacity: 0; transform: translateX(-50%) translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
        }

        .app {
            display: none;
        }
        .app.active {
            display: block;
        }
        .app-content {
            padding: 40px;
            text-align: center;
            color: #8888a0;
        }
        .app-content h2 {
            color: #e8e8f0;
            margin-bottom: 20px;
        }
        .app-content .status {
            font-size: 1.2rem;
            margin: 16px 0;
        }
        .app-content .countdown {
            font-size: 1rem;
            color: #feca57;
            margin: 8px 0;
        }
        .app-content .countdown strong {
            color: #2ed573;
            font-size: 1.4rem;
        }
        .btn-logout {
            margin-top: 30px;
            padding: 12px 30px;
            background: #ff4757;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-logout:hover {
            transform: scale(1.05);
        }
        .btn-toast {
            margin-top: 12px;
            padding: 10px 24px;
            background: rgba(108,92,231,0.3);
            color: #a29bfe;
            border: 1px solid rgba(108,92,231,0.3);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-toast:hover {
            background: rgba(108,92,231,0.5);
        }

        @media (max-width: 480px) {
            .auth-screen { padding: 30px 20px; }
            .auth-screen h2 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <!-- Фоновые частицы -->
    <div class="bg-particles">
        <div class="bg-particle" style="width:200px;height:200px;left:10%;top:20%;"></div>
        <div class="bg-particle" style="width:150px;height:150px;right:15%;bottom:30%;animation-delay:3s;"></div>
        <div class="bg-particle" style="width:100px;height:100px;left:50%;top:60%;animation-delay:6s;"></div>
    </div>
    <div class="bg-grid"></div>

    <!-- Экран авторизации -->
    <div class="auth-screen" id="authScreen">
        <h2>CyberForce</h2>
        <p class="subtitle">Защищённый мессенджер</p>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Пароль">
        <button id="loginBtn" onclick="handleLogin()">Войти</button>
        <div class="toggle-text">
            <span onclick="handleTechWork()">Нет аккаунта? Зарегистрироваться</span>
        </div>
        <div class="toggle-text" style="margin-top:6px;">
            <span onclick="handleTechWork()">Забыли пароль?</span>
        </div>
    </div>

    <!-- Основное приложение -->
    <div class="app" id="app">
        <div class="app-content">
            <h2>⚡ CyberForce</h2>
            <div class="status">Технические работы</div>
            <div class="countdown">Осталось <strong>5</strong> этапов до полного релиза</div>
            <div style="font-size:0.85rem;color:#8888a0;margin-top:8px;">🚧 Скоро всё будет</div>
            <button class="btn-logout" onclick="handleLogout()">🚪 Выйти</button>
            <br>
            <button class="btn-toast" onclick="showTechNotification()">📢 Показать уведомление снова</button>
        </div>
    </div>

    <script>
        // =================================================================
        // УВЕДОМЛЕНИЕ О ТЕХРАБОТАХ
        // =================================================================
        let toastTimeout = null;

        window.showTechNotification = function() {
            const oldToast = document.querySelector('.toast');
            if (oldToast) {
                oldToast.remove();
                if (toastTimeout) {
                    clearTimeout(toastTimeout);
                    toastTimeout = null;
                }
            }

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `
                <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;">
                    <span style="font-size:1.6rem;">⚙️</span>
                    <span><strong style="color:#a29bfe;font-size:1.1rem;">Технические работы</strong></span>
                    <span style="color:#6c5ce7;">|</span>
                    <span>Осталось <strong style="color:#feca57;font-size:1.2rem;">5</strong> этапов до полного релиза</span>
                    <span style="color:#6c5ce7;">|</span>
                    <span style="font-size:0.85rem;background:rgba(46,213,115,0.15);padding:4px 14px;border-radius:20px;color:#2ed573;">🚧 Скоро всё будет</span>
                </div>
                <div style="margin-top:6px;font-size:0.75rem;color:#8888a0;letter-spacing:0.5px;">
                    Спасибо за понимание ❤️
                </div>
            `;

            document.body.appendChild(toast);

            toastTimeout = setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(30px)';
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 400);
                toastTimeout = null;
            }, 12000);

            toast.onclick = function() {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(30px)';
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 400);
                if (toastTimeout) {
                    clearTimeout(toastTimeout);
                    toastTimeout = null;
                }
            };
        };

        // =================================================================
        // ЛОГИКА ВХОДА/ВЫХОДА
        // =================================================================
        window.handleLogin = function() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('app').classList.add('active');

            setTimeout(() => {
                showTechNotification();
            }, 500);
        };

        window.handleLogout = function() {
            document.getElementById('app').classList.remove('active');
            document.getElementById('authScreen').style.display = 'block';
            
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            
            const toast = document.querySelector('.toast');
            if (toast) toast.remove();
            if (toastTimeout) {
                clearTimeout(toastTimeout);
                toastTimeout = null;
            }
        };

        // =================================================================
        // ТЕХНИЧЕСКИЕ РАБОТЫ ДЛЯ РЕГИСТРАЦИИ И ЗАБЫЛИ ПАРОЛЬ
        // =================================================================
        window.handleTechWork = function() {
            showTechNotification();
        };

        // Нажатие Enter
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('input').forEach(function(input) {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        document.getElementById('loginBtn').click();
                    }
                });
            });
        });

        console.log('✅ CyberForce Messenger — Технические работы');
        console.log('📌 Осталось 5 этапов до полного релиза');
        console.log('💡 Нажми "Войти", "Регистрация" или "Забыли пароль" — везде техработы');
    </script>

</body>
</html>
