<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Мессенджер | Киберфорс</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --bg: #f0f2f5; --surface: #ffffff; --text: #1a1a1a; --text-secondary: #888888; --primary: #4a7cfe; --border: #e0e0e0; --safe-bottom: env(safe-area-inset-bottom, 0px); }
    body.dark { --bg: #1a1a2e; --surface: #222222; --text: #eeeeee; --text-secondary: #aaaaaa; --primary: #4a7cfe; --border: #444444; }
    body.cyberforce { --bg: #020503; --surface: rgba(10,20,15,0.95); --text: #e2e8f0; --text-secondary: #94a3b8; --primary: #10b981; --border: rgba(16,185,129,0.3); font-family: 'Orbitron',sans-serif; letter-spacing: 0.5px; }
    body.cherry { --bg: #1a0a0a; --surface: #2d1111; --text: #f0d0d0; --text-secondary: #c09090; --primary: #e74c3c; --border: #5c2020; }
    body.ocean { --bg: #0a1a2a; --surface: #112233; --text: #d0e0f0; --text-secondary: #90b0c0; --primary: #3498db; --border: #204060; }
    body.caramel { --bg: #f5f0e8; --surface: #fff8f0; --text: #4a3020; --text-secondary: #8a7060; --primary: #c08050; --border: #d0c0b0; }
    body { font-family: 'Inter',sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; transition: background 0.3s, color 0.3s; overflow: hidden; position: relative; }
    .auth-screen { background: var(--surface); padding: 32px 24px; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); width: 100%; max-width: 400px; text-align: center; display: none; flex-direction: column; gap: 14px; backdrop-filter: blur(20px); border: 1px solid var(--border); z-index: 2; }
    .auth-screen.active { display: flex; }
    .auth-screen h2 { font-weight: 700; font-size: 1.8rem; background: linear-gradient(135deg, var(--primary), #fff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
    .auth-screen input { width: 100%; padding: 16px; border: 1px solid var(--border); border-radius: 14px; font-size: 1rem; outline: none; background: var(--bg); color: var(--text); transition: border 0.2s; }
    .auth-screen input:focus { border-color: var(--primary); }
    .auth-screen button { width: 100%; padding: 16px; background: var(--primary); color: #fff; border: none; border-radius: 14px; font-weight: 700; font-size: 1rem; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: opacity 0.2s; }
    .auth-screen button:active { opacity: 0.8; }
    .auth-screen .toggle-text { font-size: 0.9rem; color: var(--text-secondary); }
    .auth-screen .toggle-text span { color: var(--primary); cursor: pointer; font-weight: 700; }
    .auth-error { color: #e74c3c; font-size: 0.85rem; min-height: 20px; }
    .app { width: 100%; height: 100vh; display: none; flex-direction: column; background: transparent; overflow: hidden; position: relative; z-index: 1; }
    .app.active { display: flex; }
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; z-index: 10; }
    .header h3 { font-weight: 700; font-size: 1.2rem; letter-spacing: 1px; flex-shrink: 0; white-space: nowrap; }
    .header-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .icon-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 12px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .icon-btn:active { background: var(--primary); color: #fff; }
    .logout-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: all 0.2s; }
    .logout-btn:active { background: var(--primary); color: #fff; }
    .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 5; }
    .tab { flex: 1; text-align: center; padding: 12px 8px; font-weight: 600; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.3s; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; font-size: 0.75rem; }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 0; }
    .list-item { margin: 6px 12px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); transition: all 0.2s; }
    .list-item:active { border-color: var(--primary); transform: scale(0.98); }
    .avatar { width: 44px; height: 44px; border-radius: 14px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; flex-shrink: 0; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .item-info { flex: 1; min-width: 0; }
    .item-title { font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 4px; }
    .item-subtitle { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .group-badge { background: var(--primary); color: #fff; font-size: 0.6rem; padding: 2px 6px; border-radius: 8px; font-weight: 600; }
    .empty-state { padding: 60px 20px; text-align: center; color: var(--text-secondary); }
    .chat-panel { display: none; flex-direction: column; height: 100%; }
    .chat-panel.active { display: flex; }
    .chat-header { background: var(--surface); padding: 10px 14px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
    .back-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .call-btn { background: var(--primary); border: none; color: #fff; width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; margin-left: auto; flex-shrink: 0; }
    .messages { flex: 1; padding: 12px; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 8px; }
    .msg-wrapper { position: relative; display: flex; animation: fadeIn 0.3s ease; }
    .msg-wrapper.sent { justify-content: flex-end; }
    .msg-wrapper.received { justify-content: flex-start; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
    .msg img, .msg video { max-width: 200px; max-height: 200px; border-radius: 10px; display: block; margin: 4px 0; }
    .msg.sent { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
    .msg.received { background: var(--surface); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
    .save-btn { position: absolute; top: -4px; right: -4px; background: var(--primary); color: #fff; border: none; width: 22px; height: 22px; border-radius: 50%; font-size: 0.7rem; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 10; }
    .msg-wrapper:active .save-btn, .msg-wrapper:hover .save-btn { display: flex; }
    .typing-indicator { font-size: 0.75rem; color: var(--text-secondary); padding: 2px 14px; font-style: italic; }
    .input-area { padding: 8px 12px; padding-bottom: calc(8px + var(--safe-bottom)); background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
    .input-area input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 20px; font-size: 0.9rem; outline: none; background: var(--bg); color: var(--text); }
    .input-area button { height: 38px; border-radius: 20px; border: none; background: var(--primary); color: #fff; font-size: 1rem; cursor: pointer; padding: 0 14px; white-space: nowrap; }
    .attach-btn { background: transparent; border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .tools-panel { display: none; flex-wrap: wrap; gap: 6px; padding: 6px 12px; background: var(--surface); border-top: 1px solid var(--border); }
    .tools-panel.active { display: flex; }
    .tool-btn { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 14px; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s; white-space: nowrap; }
    .tool-btn:active { background: var(--primary); color: #fff; }
    .tool-btn.recording { background: #e74c3c; color: #fff; border-color: #e74c3c; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: 0.3s; }
    .modal.active { visibility: visible; opacity: 1; }
    .modal-content { background: var(--surface); padding: 24px; border-radius: 20px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; color: var(--text); border: 1px solid var(--border); }
    .modal-content h3 { margin-bottom: 14px; font-weight: 700; font-size: 1.1rem; }
    .modal-content input, .modal-content textarea { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid var(--border); border-radius: 12px; font-size: 0.9rem; background: var(--bg); color: var(--text); resize: vertical; }
    .modal-content button { width: 100%; padding: 12px; margin-top: 8px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
    .btn-secondary { background: var(--border) !important; color: var(--text) !important; }
    .theme-options { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; margin-top: 8px; }
    .theme-opt { padding: 10px 4px; border-radius: 12px; border: 2px solid var(--border); cursor: pointer; text-align: center; font-weight: 600; font-size: 0.65rem; transition: all 0.3s; }
    .theme-opt.active { border-color: var(--primary); background: var(--bg); }
    .contact-checkbox { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-size: 0.9rem; }
    .contact-checkbox input { width: auto; }
    @media (min-width: 768px) { .app { max-width: 500px; height: 90vh; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,0.3); } .auth-screen { max-width: 420px; } }
  </style>
</head>
<body>

  <div id="authScreen" class="auth-screen active">
    <h2 id="authTitle">Вход</h2>
    <input type="email" id="email" placeholder="Email" autocomplete="email">
    <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
    <div id="extraFields" style="display:none;">
      <input type="text" id="displayName" placeholder="Имя">
      <input type="tel" id="phone" placeholder="Телефон (только цифры)" pattern="[0-9]*" inputmode="numeric">
    </div>
    <div class="auth-error" id="authError"></div>
    <button id="authBtn" onclick="handleAuth()">Войти</button>
    <div class="toggle-text"><span onclick="toggleMode()">Нет аккаунта? Зарегистрироваться</span></div>
  </div>

  <div id="app" class="app">
    <div id="mainPanel">
      <div class="header">
        <h3>Сообщения</h3>
        <div class="header-btns">
          <button class="icon-btn" onclick="openCreateGroup()">👥</button>
          <button class="icon-btn" onclick="openSettings()">⚙️</button>
          <button class="icon-btn" onclick="openProfile()">👤</button>
          <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
      </div>
      <div class="tabs">
        <div class="tab active" onclick="switchTab('chats')">Чаты</div>
        <div class="tab" onclick="switchTab('contacts')">Контакты</div>
        <div class="tab" onclick="switchTab('system')">Системные</div>
      </div>
      <div id="chatList" class="list"></div>
      <div id="contactList" class="list" style="display:none;"></div>
      <div id="systemList" class="list" style="display:none;"></div>
    </div>
    <div id="chatPanel" class="chat-panel"></div>
  </div>

  <div id="addContactModal" class="modal">...</div> <!-- сохранено как было, сокращено для brevity -->
  <div id="createGroupModal" class="modal">...</div>
  <div id="editGroupModal" class="modal">...</div>
  <div id="scheduleModal" class="modal">...</div>
  <div id="settingsModal" class="modal">...</div>
  <div id="profileModal" class="modal">...</div>
  <div id="userInfoModal" class="modal">...</div>
  <div id="changePhoneModal" class="modal">...</div>

  <script>
    // ============ FIREBASE INIT ============
    firebase.initializeApp({
      apiKey: "AIzaSyBoKOLs5MwXYAjMkl3CtplfVE441IE3vEA",
      authDomain: "messenger-bcdd6.firebaseapp.com",
      projectId: "messenger-bcdd6",
      storageBucket: "messenger-bcdd6.firebasestorage.app",
      messagingSenderId: "974794455260",
      appId: "1:974794455260:web:c3367bc6e548718d871c19"
    });
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============ GLOBALS ============
    let currentUser = null;
    let currentUserProfile = null;
    let isLogin = true;
    let currentChat = null;
    let chatUnsubscribe = null;
    let chatListUnsubscribe = null;
    let verificationCode = null;
    let codeExpiry = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let typingTimeout = null;
    let chatTypingUnsubscribe = null;
    let editingGroupId = null;

    // WebRTC
    let localStream = null;
    let peerConnection = null;
    let callInProgress = false;
    let currentCallDocId = null;
    let callDocListener = null;

    const SYSTEM_BOTS = {
      'favorites-bot': { displayName: '⭐ Избранное', email: 'fav@sys', phone: '' },
      'verification-bot': { displayName: '🔐 Verification', email: 'ver@sys', phone: '' },
      'saved-bot': { displayName: '💾 Сохранённые', email: 'saved@sys', phone: '' }
    };
    const SYSTEM_IDS = Object.keys(SYSTEM_BOTS);
    const THEMES = ['default', 'dark', 'cyberforce', 'cherry', 'ocean', 'caramel'];

    // ... (весь остальной код без изменений, кроме startCall и обработки ошибок) ...

    // ==================== WEBRTC CALLS (исправлено) ====================
    window.startCall = async () => {
      if (!currentChat || callInProgress) return;
      
      // Проверка HTTPS
      if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
        alert('❌ Звонки работают только по HTTPS. Откройте сайт через https://...');
        return;
      }

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        callInProgress = true;

        const callDocRef = db.collection('calls').doc();
        currentCallDocId = callDocRef.id;
        await callDocRef.set({
          chatId: currentChat.chatId,
          participants: [currentUser.uid, currentChat.otherUser.id],
          callerId: currentUser.uid,
          status: 'ringing',
          offer: null,
          answer: null,
          candidates: [],
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        await callDocRef.update({ offer: JSON.stringify(offer) });

        listenCallDoc(callDocRef);
        showCallUI();

      } catch (e) {
        console.error('Ошибка звонка:', e);
        if (e.name === 'NotAllowedError') {
          alert('⛔ Доступ к камере/микрофону запрещён. Разрешите в настройках браузера и обновите страницу.');
        } else if (e.name === 'NotFoundError') {
          alert('📷 Не найдена камера или микрофон.');
        } else {
          alert('❌ Ошибка доступа к медиа: ' + e.message);
        }
        endCall();
      }
    };

    // ... (остальные функции звонков без изменений) ...
  </script>
</body>
</html>
