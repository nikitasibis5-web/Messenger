<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CyberForce">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <title>CyberForce Messenger</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0a0a0f; --surface: #13131a; --surface2: #1a1a24;
      --text: #e8e8f0; --text-secondary: #8888a0;
      --primary: #6c5ce7; --primary-light: #a29bfe; --primary-dark: #4a3db5;
      --accent: #00d2ff; --accent2: #7c3aed;
      --danger: #ff4757; --success: #2ed573; --warning: #ffa502;
      --border: rgba(255,255,255,0.06);
      --glass: rgba(255,255,255,0.03);
      --glow: 0 0 20px rgba(108,92,231,0.3);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --radius: 16px; --radius-sm: 10px; --radius-lg: 24px;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; align-items: center;
      justify-content: center; overflow: hidden; position: relative;
    }
    .bg-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.4; }
    .bg-particle { position: absolute; border-radius: 50%; background: var(--primary); filter: blur(60px); animation: floatParticle 8s ease-in-out infinite; }
    @keyframes floatParticle { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(30px,-50px) scale(1.3); } 66% { transform: translate(-20px,30px) scale(0.8); } }
    .bg-grid { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.03; background-image: linear-gradient(rgba(255,255,255,0.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.1) 1px,transparent 1px); background-size: 40px 40px; }
    .hearts-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; display: none; }
    .heart-particle { position: absolute; color: #ff0000; opacity: 0; font-size: 20px; animation: floatUp linear infinite; }
    @keyframes floatUp { 0% { transform: translateY(100vh) rotate(0deg) scale(0); opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.6; } 100% { transform: translateY(-10vh) rotate(360deg) scale(1.2); opacity: 0; } }
    
    .auth-screen { background: var(--surface); backdrop-filter: blur(20px); padding: 40px 32px; border-radius: var(--radius-lg); box-shadow: 0 20px 60px rgba(0,0,0,0.5),var(--glow); width: 100%; max-width: 420px; text-align: center; display: none; flex-direction: column; gap: 20px; z-index: 2; border: 1px solid var(--border); position: relative; overflow: hidden; }
    .auth-screen::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle,rgba(108,92,231,0.1) 0%,transparent 70%); animation: rotateBg 10s linear infinite; }
    @keyframes rotateBg { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .auth-screen.active { display: flex; }
    .auth-screen h2 { font-weight: 800; font-size: 2rem; background: linear-gradient(135deg,var(--primary),var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; position: relative; z-index: 1; }
    .auth-screen .subtitle { font-size: 0.9rem; color: var(--text-secondary); position: relative; z-index: 1; margin-top: -12px; }
    .auth-screen input { width: 100%; padding: 16px 20px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 1rem; outline: none; background: var(--surface2); color: var(--text); transition: all 0.3s; position: relative; z-index: 1; }
    .auth-screen input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108,92,231,0.1); }
    .auth-screen .phone-input-group { display: flex; gap: 0; position: relative; z-index: 1; }
    .auth-screen .phone-prefix { padding: 16px 14px; background: var(--surface2); border: 1px solid var(--border); border-right: none; border-radius: var(--radius) 0 0 var(--radius); color: var(--text-secondary); font-weight: 600; font-size: 1rem; display: flex; align-items: center; white-space: nowrap; }
    .auth-screen .phone-input { flex: 1; padding: 16px 20px; border: 1px solid var(--border); border-radius: 0 var(--radius) var(--radius) 0; font-size: 1rem; outline: none; background: var(--surface2); color: var(--text); }
    .auth-screen .phone-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108,92,231,0.1); }
    .auth-screen button { width: 100%; padding: 16px; background: linear-gradient(135deg,var(--primary),var(--accent2)); color: #fff; border: none; border-radius: var(--radius); font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.3s; position: relative; z-index: 1; box-shadow: 0 4px 15px rgba(108,92,231,0.4); }
    .auth-screen button:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(108,92,231,0.6); }
    .auth-screen .toggle-text { font-size: 0.9rem; color: var(--text-secondary); position: relative; z-index: 1; }
    .auth-screen .toggle-text span { color: var(--accent); cursor: pointer; font-weight: 600; }
    .auth-error { color: var(--danger); font-size: 0.85rem; min-height: 20px; position: relative; z-index: 1; }
    
    .install-banner { display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 20px; z-index: 100; box-shadow: 0 10px 40px rgba(0,0,0,0.5); align-items: center; gap: 12px; color: var(--text); }
    .install-banner.show { display: flex; }
    .install-banner button { padding: 10px 20px; background: var(--primary); color: #fff; border: none; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; }
    
    .app { width: 100%; height: 100vh; display: none; flex-direction: column; background: transparent; overflow: hidden; position: relative; z-index: 1; }
    .app.active { display: flex; }
    .header { background: var(--glass); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 8px; z-index: 10; }
    .header h3 { font-weight: 800; font-size: 1.3rem; background: linear-gradient(135deg,var(--primary-light),var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; flex-shrink: 0; }
    .header-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .icon-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: var(--radius-sm); cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .icon-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: var(--glow); }
    .logout-btn { background: rgba(255,71,87,0.1); border: 1px solid rgba(255,71,87,0.3); color: var(--danger); padding: 8px 16px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .logout-btn:hover { background: var(--danger); color: #fff; }
    .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 5; padding: 0 8px; }
    .tab { flex: 1; text-align: center; padding: 14px 6px; font-weight: 600; cursor: pointer; color: var(--text-secondary); font-size: 0.85rem; transition: all 0.3s; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--primary-light); border-bottom-color: var(--primary); }
    .list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 0; scroll-behavior: smooth; }
    .list-item { margin: 6px 16px; padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; border: 1px solid var(--border); border-radius: var(--radius); background: var(--glass); backdrop-filter: blur(10px); transition: all 0.2s; }
    .list-item:hover { border-color: var(--primary); background: rgba(108,92,231,0.05); box-shadow: 0 4px 20px rgba(0,0,0,0.3); transform: translateY(-1px); }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg,var(--primary),var(--accent2)); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; flex-shrink: 0; overflow: hidden; position: relative; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .online-dot { position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface); }
    .online-dot.online { background: var(--success); box-shadow: 0 0 8px rgba(46,213,115,0.6); }
    .item-info { flex: 1; min-width: 0; }
    .item-title { font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 6px; }
    .item-subtitle { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .group-badge { background: var(--primary); color: #fff; font-size: 0.65rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .bot-badge { background: var(--accent); color: #000; font-size: 0.65rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .empty-state { padding: 80px 20px; text-align: center; color: var(--text-secondary); }
    
    .chat-panel { display: none; flex-direction: column; height: 100%; background: transparent; }
    .chat-panel.active { display: flex; }
    .chat-header { background: var(--glass); backdrop-filter: blur(20px); padding: 12px 20px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); }
    .back-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: var(--radius-sm); cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
    .back-btn:hover { background: var(--primary); color: #fff; }
    .call-btn { background: var(--success); border: none; color: #fff; width: 34px; height: 34px; border-radius: var(--radius-sm); cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; margin-left: auto; box-shadow: 0 4px 15px rgba(46,213,115,0.4); }
    .messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; scroll-behavior: smooth; }
    .msg-wrapper { position: relative; display: flex; }
    .msg-wrapper.sent { justify-content: flex-end; }
    .msg-wrapper.received { justify-content: flex-start; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: var(--radius); font-size: 0.9rem; line-height: 1.5; word-break: break-word; }
    .msg.sent { background: linear-gradient(135deg,var(--primary),var(--accent2)); color: #fff; border-bottom-right-radius: 4px; }
    .msg.received { background: var(--surface2); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
    .msg img,.msg video { max-width: 200px; max-height: 200px; border-radius: var(--radius-sm); display: block; margin: 4px 0; }
    .msg .file-attachment { display: flex; align-items: center; gap: 8px; padding: 8px; background: rgba(255,255,255,0.05); border-radius: var(--radius-sm); margin-top: 4px; cursor: pointer; }
    .msg .file-attachment:hover { background: rgba(255,255,255,0.1); }
    .input-area { padding: 12px 16px; padding-bottom: calc(12px + var(--safe-bottom)); background: var(--glass); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
    .input-area input { flex: 1; padding: 12px 18px; border: 1px solid var(--border); border-radius: 25px; font-size: 0.9rem; outline: none; background: var(--surface2); color: var(--text); }
    .input-area input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108,92,231,0.1); }
    .input-area button { height: 40px; border-radius: 25px; border: none; background: linear-gradient(135deg,var(--primary),var(--accent2)); color: #fff; font-size: 1rem; cursor: pointer; padding: 0 20px; font-weight: 700; }
    .attach-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .tools-panel { display: none; flex-wrap: wrap; gap: 8px; padding: 10px 16px; background: var(--glass); border-top: 1px solid var(--border); }
    .tools-panel.active { display: flex; }
    .tool-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .tool-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
    
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000; visibility: hidden; opacity: 0; transition: 0.3s; backdrop-filter: blur(5px); }
    .modal.active { visibility: visible; opacity: 1; }
    .modal-content { background: var(--surface); padding: 28px; border-radius: var(--radius-lg); width: 90%; max-width: 420px; max-height: 85vh; overflow-y: auto; color: var(--text); border: 1px solid var(--border); box-shadow: 0 20px 60px rgba(0,0,0,0.5),var(--glow); }
    .modal-content h3 { margin-bottom: 18px; font-weight: 700; font-size: 1.2rem; background: linear-gradient(135deg,var(--primary-light),var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .modal-content input,.modal-content textarea,.modal-content select { width: 100%; padding: 14px 16px; margin: 8px 0; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; background: var(--surface2); color: var(--text); resize: vertical; }
    .modal-content input:focus,.modal-content textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(108,92,231,0.1); }
    .modal-content button { width: 100%; padding: 14px; margin-top: 10px; background: linear-gradient(135deg,var(--primary),var(--accent2)); color: #fff; border: none; border-radius: var(--radius-sm); font-weight: 700; cursor: pointer; }
    .btn-secondary { background: var(--surface2) !important; color: var(--text) !important; box-shadow: none !important; border: 1px solid var(--border) !important; }
    .btn-danger { background: var(--danger) !important; }
    
    .theme-options { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-top: 14px; }
    .theme-opt { padding: 14px 6px; border-radius: var(--radius-sm); border: 2px solid var(--border); cursor: pointer; text-align: center; font-weight: 600; font-size: 0.7rem; }
    .theme-opt.active { border-color: var(--primary); box-shadow: var(--glow); }
    
    .call-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg,#0a0a1a,#0f0f2e,#1a1040,#0a0a1a); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes pulse-ring { 0% { transform: scale(0.95); opacity: 0.7; box-shadow: 0 0 40px rgba(108,92,231,0.4); } 50% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 80px rgba(108,92,231,0.8); } 100% { transform: scale(0.95); opacity: 0.7; box-shadow: 0 0 40px rgba(108,92,231,0.4); } }
    .call-avatar-ring { width: 130px; height: 130px; border-radius: 50%; background: linear-gradient(135deg,var(--primary),var(--accent)); display: flex; align-items: center; justify-content: center; font-size: 3.5rem; font-weight: 800; margin-bottom: 20px; animation: pulse-ring 2s infinite; overflow: hidden; border: 4px solid rgba(255,255,255,0.1); }
    .call-avatar-ring img { width: 100%; height: 100%; object-fit: cover; }
    .call-name { font-size: 1.8rem; font-weight: 700; margin-bottom: 8px; }
    .call-status { font-size: 1rem; color: rgba(255,255,255,0.6); margin-bottom: 20px; letter-spacing: 2px; }
    .call-timer { font-size: 1.4rem; font-weight: 600; color: rgba(255,255,255,0.9); margin-bottom: 20px; font-variant-numeric: tabular-nums; }
    .call-participants { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
    .call-participant { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 0.9rem; border: 2px solid rgba(255,255,255,0.2); }
    .call-invite-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 10px 20px; border-radius: 25px; cursor: pointer; font-weight: 600; margin-bottom: 20px; font-size: 0.9rem; transition: all 0.2s; }
    .call-invite-btn:hover { background: rgba(255,255,255,0.2); }
    .call-actions { display: flex; gap: 24px; align-items: center; }
    .call-btn-circle { width: 64px; height: 64px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.5rem; transition: all 0.2s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    .call-btn-circle:active { transform: scale(0.9); }
    .call-btn-mute { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
    .call-btn-mute.muted { background: var(--danger); border-color: var(--danger); }
    .call-btn-end { width: 76px; height: 76px; background: var(--danger); color: white; animation: ripple 2s infinite; }
    @keyframes ripple { 0% { box-shadow: 0 0 0 0 rgba(255,71,87,0.6); } 100% { box-shadow: 0 0 0 40px rgba(255,71,87,0); } }
    .call-btn-speaker { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
    .call-btn-speaker.muted { background: var(--danger); border-color: var(--danger); }
    
    @media (min-width: 768px) { .app { max-width: 520px; height: 92vh; border-radius: var(--radius-lg); overflow: hidden; box-shadow: 0 0 60px rgba(108,92,231,0.2),0 0 0 1px var(--border); } }
  </style>
</head>
<body>
  <div class="bg-particles" id="bgParticles"></div>
  <div class="bg-grid"></div>
  <div class="hearts-bg" id="heartsBg"></div>
  
  <div id="installBanner" class="install-banner">
    <span>📱 Установить как приложение</span>
    <button onclick="installApp()">Установить</button>
    <button class="btn-secondary" onclick="document.getElementById('installBanner').classList.remove('show')" style="width:auto;padding:10px 16px;">✕</button>
  </div>

  <div id="authScreen" class="auth-screen active">
    <h2>CyberForce</h2>
    <p class="subtitle">Защищённый мессенджер</p>
    <input type="email" id="email" placeholder="Email" autocomplete="email">
    <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
    <div id="extraFields" style="display:none;">
      <input type="text" id="displayName" placeholder="Имя">
      <div class="phone-input-group">
        <span class="phone-prefix">+7</span>
        <input type="tel" id="phone" class="phone-input" placeholder="Остальная часть номера" pattern="[0-9]*" inputmode="numeric" maxlength="10">
      </div>
    </div>
    <div class="auth-error" id="authError"></div>
    <button id="authBtn" onclick="handleAuth()">Войти</button>
    <div class="toggle-text"><span onclick="toggleMode()">Нет аккаунта? Зарегистрироваться</span></div>
  </div>

  <div id="app" class="app">
    <div id="mainPanel">
      <div class="header"><h3>⚡ CyberForce</h3><div class="header-btns"><button class="icon-btn" onclick="openCreateChannel()" title="Канал">📢</button><button class="icon-btn" onclick="openCreateGroup()" title="Группа">👥</button><button class="icon-btn" onclick="openSettings()" title="Темы">🎨</button><button class="icon-btn" onclick="openProfile()" title="Профиль">👤</button><button class="logout-btn" onclick="logout()">🚪</button></div></div>
      <div class="tabs"><div class="tab active" onclick="switchTab('chats')">💬 Чаты</div><div class="tab" onclick="switchTab('system')">🤖 Боты</div></div>
      <div id="chatList" class="list"></div>
      <div id="systemList" class="list" style="display:none;"></div>
    </div>
    <div id="chatPanel" class="chat-panel"></div>
  </div>

  <div id="createGroupModal" class="modal"><div class="modal-content"><h3>Создать группу</h3><input type="text" id="groupName" placeholder="Название группы"><div id="groupContacts" style="max-height:200px;overflow-y:auto;margin:10px 0;"></div><button onclick="createGroup()">Создать</button><button class="btn-secondary" onclick="closeCreateGroup()" style="margin-top:8px;">Отмена</button></div></div>
  <div id="createChannelModal" class="modal"><div class="modal-content"><h3>Создать канал</h3><input type="text" id="channelName" placeholder="Название"><textarea id="channelDesc" rows="3" placeholder="Описание"></textarea><button onclick="createChannel()">Создать</button><button class="btn-secondary" onclick="closeCreateChannel()" style="margin-top:8px;">Отмена</button></div></div>
  <div id="settingsModal" class="modal"><div class="modal-content"><h3>🎨 Тема</h3><div class="theme-options" id="themeOptionsContainer"></div><button class="btn-secondary" onclick="closeSettings()" style="margin-top:16px;">Закрыть</button></div></div>

<script>
    firebase.initializeApp({
      apiKey: "AIzaSyBoKOLs5MwXYAjMkl3CtplfVE441IE3vEA",
      authDomain: "messenger-bcdd6.firebaseapp.com",
      projectId: "messenger-bcdd6",
      storageBucket: "messenger-bcdd6.firebasestorage.app",
      messagingSenderId: "974794455260",
      appId: "1:974794455260:web:c3367bc6e548718d871c19"
    });
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null, currentUserProfile = null, isLogin = true, currentChat = null;
    let chatUnsubscribe = null, chatListUnsubscribe = null, verificationCode = null, codeExpiry = null;
    let mediaRecorder = null, audioChunks = [], isRecording = false, typingTimeout = null, chatTypingUnsubscribe = null;
    let editingGroupId = null, currentPostId = null, replyingTo = null, presenceInterval = null;
    let localStream = null, peerConnections = [], callInProgress = false, currentCallDocId = null, callDocListener = null;
    let heartsInterval = null, deferredPrompt = null, callTimerInterval = null, callStartTime = null;
    let _micMuted = false, _speakerMuted = false, _callTimeout = null;

    const TEST_BOT_ID = 'test-call-bot';
    const TEST_BOT_PROFILE = { displayName: '🤖 Тестовый Бот', email: 'testbot@sys', phone: '+70000000000', bio: 'Позвони мне для проверки!', photoURL: '', mode: 'online' };
    const SYSTEM_BOTS = {
      'favorites-bot': { displayName: '⭐ Избранное', email: 'fav@sys', phone: '' },
      'verification-bot': { displayName: '🔐 Verification', email: 'ver@sys', phone: '' },
      'saved-bot': { displayName: '💾 Сохранённые', email: 'saved@sys', phone: '' },
      'group-invites-bot': { displayName: '📨 Приглашения в группы', email: 'ginv@sys', phone: '' },
      'channel-invites-bot': { displayName: '📢 Приглашения в каналы', email: 'cinv@sys', phone: '' },
      [TEST_BOT_ID]: TEST_BOT_PROFILE
    };
    const SYSTEM_IDS = Object.keys(SYSTEM_BOTS);

    const THEME_PRESETS = [
      { name: '🌌 Кибер', bg: '#0a0a0f', surface: '#13131a', surface2: '#1a1a24', text: '#e8e8f0', textSecondary: '#8888a0', primary: '#6c5ce7', primaryLight: '#a29bfe', accent: '#00d2ff', accent2: '#7c3aed', border: 'rgba(255,255,255,0.06)', font: 'Inter, sans-serif' },
      { name: '🌙 Тёмная', bg: '#0d1117', surface: '#161b22', surface2: '#21262d', text: '#c9d1d9', textSecondary: '#8b949e', primary: '#58a6ff', primaryLight: '#79c0ff', accent: '#3fb950', accent2: '#238636', border: '#30363d', font: 'Inter, sans-serif' },
      { name: '🌸 Розовая', bg: '#1a0d15', surface: '#241420', surface2: '#2d1a28', text: '#f0d0e0', textSecondary: '#c090a0', primary: '#e91e63', primaryLight: '#f06292', accent: '#ff80ab', accent2: '#c2185b', border: 'rgba(233,30,99,0.2)', font: 'Inter, sans-serif' },
      { name: '🌿 Зелёная', bg: '#0a0f0a', surface: '#0f1a0f', surface2: '#152415', text: '#d0f0d0', textSecondary: '#90c090', primary: '#2ecc71', primaryLight: '#58d68d', accent: '#27ae60', accent2: '#1e8449', border: 'rgba(46,204,113,0.2)', font: 'Inter, sans-serif' },
      { name: '🍊 Оранж', bg: '#0f0a05', surface: '#1a120a', surface2: '#241a10', text: '#f0d0b0', textSecondary: '#c0a080', primary: '#ff6b35', primaryLight: '#ff8c5a', accent: '#ffa502', accent2: '#e67e22', border: 'rgba(255,107,53,0.2)', font: 'Inter, sans-serif' },
      { name: '💜 Фиолет', bg: '#0a0a1a', surface: '#12122a', surface2: '#1a1a3a', text: '#d0d0f0', textSecondary: '#9090c0', primary: '#9b59b6', primaryLight: '#bb8fce', accent: '#8e44ad', accent2: '#6c3483', border: 'rgba(155,89,182,0.2)', font: 'Inter, sans-serif' },
      { name: '🌈 Радуга', bg: '#0a0a15', surface: '#15152a', surface2: '#20203a', text: '#f0e8ff', textSecondary: '#b0a0c0', primary: '#c026d3', primaryLight: '#d946ef', accent: '#f59e0b', accent2: '#8b5cf6', border: 'rgba(192,38,211,0.2)', font: 'Inter, sans-serif' },
      { name: '❤️ Андертейл', bg: '#000000', surface: '#111111', surface2: '#1a1a1a', text: '#ffffff', textSecondary: '#cccccc', primary: '#ff0000', primaryLight: '#ff4444', accent: '#ff0000', accent2: '#cc0000', border: 'rgba(255,0,0,0.2)', font: 'Orbitron, sans-serif', hearts: true }
    ];

    function initBgParticles() { const c=document.getElementById('bgParticles'); if(!c)return; c.innerHTML=''; for(let i=0;i<5;i++){ const p=document.createElement('div'); p.className='bg-particle'; const s=Math.random()*200+100; p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*80}%;top:${Math.random()*80}%;animation-delay:${Math.random()*8}s;animation-duration:${Math.random()*8+6}s;opacity:${Math.random()*0.3+0.1};`; c.appendChild(p); } }
    initBgParticles();

    function startHearts() { const c=document.getElementById('heartsBg'); if(!c)return; c.style.display='block'; c.innerHTML=''; function ch(){ const h=document.createElement('div'); h.className='heart-particle'; h.textContent='❤️'; h.style.left=Math.random()*100+'%'; h.style.fontSize=(Math.random()*20+10)+'px'; h.style.animationDuration=(Math.random()*3+4)+'s'; h.style.animationDelay=Math.random()*2+'s'; c.appendChild(h); setTimeout(()=>{ if(h.parentNode)h.remove(); },7000); } for(let i=0;i<15;i++)setTimeout(ch,i*300); if(heartsInterval)clearInterval(heartsInterval); heartsInterval=setInterval(()=>{ if(c.style.display!=='none')ch(); },500); }
    function stopHearts() { const c=document.getElementById('heartsBg'); if(c){c.style.display='none';c.innerHTML='';} if(heartsInterval){clearInterval(heartsInterval);heartsInterval=null;} }

    function applyTheme(tn) { const t=THEME_PRESETS.find(x=>x.name===tn)||THEME_PRESETS[0]; const r=document.documentElement; r.style.setProperty('--bg',t.bg); r.style.setProperty('--surface',t.surface); r.style.setProperty('--surface2',t.surface2); r.style.setProperty('--text',t.text); r.style.setProperty('--text-secondary',t.textSecondary); r.style.setProperty('--primary',t.primary); r.style.setProperty('--primary-light',t.primaryLight); r.style.setProperty('--accent',t.accent); r.style.setProperty('--accent2',t.accent2); r.style.setProperty('--border',t.border); document.body.style.background=t.bg; document.body.style.fontFamily=t.font||'Inter, sans-serif'; localStorage.setItem('theme',tn); if(t.hearts)startHearts();else stopHearts(); updateThemeUI(); }
    function updateThemeUI() { const cur=localStorage.getItem('theme')||'🌌 Кибер'; document.querySelectorAll('.theme-opt').forEach(o=>o.classList.remove('active')); document.querySelectorAll('.theme-opt').forEach(o=>{if(o.getAttribute('data-theme')===cur)o.classList.add('active');}); }
    function renderThemeOptions() { const c=document.getElementById('themeOptionsContainer'); if(!c)return; c.innerHTML=THEME_PRESETS.map(t=>`<div class="theme-opt ${(localStorage.getItem('theme')||'🌌 Кибер')===t.name?'active':''}" data-theme="${t.name}" onclick="setTheme('${t.name}')" style="background:${t.bg};color:${t.text};border-color:${t.primary};">${t.name}</div>`).join(''); }
    window.setTheme=(t)=>applyTheme(t);
    applyTheme(localStorage.getItem('theme')||'🌌 Кибер');

    window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBanner').classList.add('show');});
    window.installApp=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBanner').classList.remove('show');}else alert('Нажмите "На экран" в меню браузера');};

    window.toggleMode=()=>{isLogin=!isLogin;document.getElementById('authScreen').querySelector('h2').textContent=isLogin?'Вход':'Регистрация';document.getElementById('authBtn').textContent=isLogin?'Войти':'Зарегистрироваться';document.getElementById('extraFields').style.display=isLogin?'none':'block';document.getElementById('authError').textContent='';};

    function validateRussianPhone(phone){const c=phone.replace(/[\s\-\(\)]/g,'');if(c.length===11&&c.startsWith('8'))return'+7'+c.slice(1);if(c.length===11&&c.startsWith('+7'))return c;if(c.length===10&&c.startsWith('9'))return'+7'+c;if(c.length===10)return'+7'+c;return null;}

    window.handleAuth=async()=>{const email=document.getElementById('email').value.trim();const pass=document.getElementById('password').value.trim();const name=document.getElementById('displayName').value.trim();const phoneRaw=document.getElementById('phone').value.trim();if(!email||!pass){document.getElementById('authError').textContent='Заполните email и пароль';return;}if(!isLogin&&!name){document.getElementById('authError').textContent='Введите имя';return;}let phone='+7'+phoneRaw;if(!isLogin){if(!phoneRaw||phoneRaw.length<10){document.getElementById('authError').textContent='Введите 10 цифр номера';return;}const v=validateRussianPhone(phone);if(!v){document.getElementById('authError').textContent='Неверный формат номера';return;}phone=v;const exist=await db.collection('users').where('phone','==',phone).get();if(!exist.empty&&exist.docs[0].id!==(currentUser?.uid||'')){document.getElementById('authError').textContent='Этот номер уже используется';return;}}try{if(isLogin)await auth.signInWithEmailAndPassword(email,pass);else{const cred=await auth.createUserWithEmailAndPassword(email,pass);await db.collection('users').doc(cred.user.uid).set({email,displayName:name,phone,bio:'',photoURL:'',mode:'online',invisible:false});}}catch(err){document.getElementById('authError').textContent=err.message;}};
    window.logout=()=>auth.signOut();

    async function ensureSystemChats(uid){for(const[botId,profile]of Object.entries(SYSTEM_BOTS)){await db.collection('users').doc(botId).set(profile,{merge:true});const chatId=[uid,botId].sort().join('_');const ref=db.collection('chats').doc(chatId);if(!(await ref.get()).exists){await ref.set({participants:[uid,botId],updatedAt:firebase.firestore.FieldValue.serverTimestamp()});if(botId===TEST_BOT_ID)await ref.collection('messages').add({senderId:botId,text:'👋 Привет! Я тестовый бот для проверки звонков. Нажми 📞 чтобы позвонить!',timestamp:firebase.firestore.FieldValue.serverTimestamp()});if(botId==='favorites-bot')await ref.collection('messages').add({senderId:botId,text:'📌 Ваш личный чат для заметок',timestamp:firebase.firestore.FieldValue.serverTimestamp()});if(botId==='saved-bot')await ref.collection('messages').add({senderId:botId,text:'💾 Здесь будут ваши сохранённые сообщения',timestamp:firebase.firestore.FieldValue.serverTimestamp()});}}}

    function startPresence(){if(!currentUser)return;const ref=db.collection('users').doc(currentUser.uid).collection('presence').doc('status');ref.set({online:true,mode:currentUserProfile?.mode||'online',lastSeen:firebase.firestore.FieldValue.serverTimestamp()});window.addEventListener('beforeunload',()=>{ref.set({online:false,lastSeen:firebase.firestore.FieldValue.serverTimestamp()});});if(presenceInterval)clearInterval(presenceInterval);presenceInterval=setInterval(()=>{ref.update({lastSeen:firebase.firestore.FieldValue.serverTimestamp()});},60000);}
    function stopPresence(){if(presenceInterval)clearInterval(presenceInterval);if(currentUser)db.collection('users').doc(currentUser.uid).collection('presence').doc('status').set({online:false,lastSeen:firebase.firestore.FieldValue.serverTimestamp()});}
    function renderOnlineDot(s){if(s==='online')return'<div class="online-dot online"></div>';if(s==='sleep')return'<div class="online-dot sleep"></div>';return'';}
    async function getOnlineStatus(oid){if(!oid||SYSTEM_IDS.includes(oid))return'offline';const d=await db.collection('users').doc(oid).collection('presence').doc('status').get();if(!d.exists)return'offline';const data=d.data();if(!data.online)return'offline';if(Date.now()-(data.lastSeen?.toMillis()||0)>90000)return'offline';return data.mode||'online';}

    function getUserAvatar(u){if(!u)return'';if(u.photoURL&&u.photoURL.startsWith('data:'))return`<img src="${u.photoURL}" alt="${u.displayName||''}" onerror="this.style.display='none'">`;if(u.groupAvatar&&u.groupAvatar.startsWith('data:'))return`<img src="${u.groupAvatar}" alt="${u.displayName||''}" onerror="this.style.display='none'">`;return'';}

    function renderMessageContent(m,docId){let c='';if(m.audio)c=`<div>🎵 <audio controls src="${m.audio}"></audio></div>`;else if(m.image)c=`<img src="${m.image}" style="max-width:200px;max-height:200px;border-radius:10px;" onerror="this.style.display='none'">`;else if(m.video)c=`<video controls src="${m.video}" style="max-width:200px;max-height:200px;border-radius:10px;" onerror="this.style.display='none'"></video>`;else if(m.file){const icon=m.fileType?.includes('zip')||m.fileType?.includes('rar')?'📦':m.fileType?.includes('pdf')?'📄':'📎';c=`<div class="file-attachment" onclick="window.open('${m.file}','_blank')"><span style="font-size:1.5rem;">${icon}</span><div><div style="font-weight:600;">${m.fileName||'Файл'}</div><div style="font-size:0.75rem;opacity:0.7;">${(m.fileSize/1024).toFixed(1)} КБ</div></div></div>`;}else if(m.poll){const p=m.poll;c=`<div style="font-weight:600;">📊 ${p.question}</div><div class="poll-options">`;p.options.forEach((o,i)=>{const tv=p.totalVotes||1;const pc=Math.round((o.votes.length/tv)*100);c+=`<div class="poll-option" onclick="votePoll('${docId}',${i})">${o.text}<span>${o.votes.length} (${pc}%)</span><div class="bar" style="width:${pc}%"></div></div>`;});c+=`</div>`;}else if(m.invite){const inv=m.invite;c=`<div style="font-weight:600;">📨 Приглашение</div><div>${inv.text||'Вас приглашают'}</div>`;if(!inv.accepted&&!inv.declined)c+=`<div class="invite-buttons"><button class="invite-btn accept" onclick="acceptInvite('${docId}')">Принять</button><button class="invite-btn decline" onclick="declineInvite('${docId}')">Отклонить</button></div>`;else if(inv.accepted)c+='<div style="color:var(--success);">✓ Принято</div>';else c+='<div style="color:var(--danger);">✕ Отклонено</div>';}else c=m.text||'';if(m.edited)c+='<span class="msg-edited"> изм.</span>';return c;}

    window.acceptInvite=async(mid)=>{if(!currentChat)return;const ref=db.collection('chats').doc(currentChat.chatId).collection('messages').doc(mid);const d=await ref.get();if(!d.exists)return;const data=d.data();if(!data.invite||data.invite.accepted||data.invite.declined)return;try{if(data.invite.type==='channel'||data.invite.type==='group')await db.collection('chats').doc(data.invite.chatId).update({participants:firebase.firestore.FieldValue.arrayUnion(currentUser.uid)});await ref.update({'invite.accepted':true});alert('✅ Принято!');}catch(e){alert('Ошибка');}};
    window.declineInvite=async(mid)=>{if(!currentChat)return;const ref=db.collection('chats').doc(currentChat.chatId).collection('messages').doc(mid);const d=await ref.get();if(!d.exists)return;await ref.update({'invite.declined':true});};

    window.openPoll=()=>{document.getElementById('pollModal').classList.add('active');document.getElementById('pollQuestion').value='';document.getElementById('pollOptionsContainer').innerHTML='<div style="display:flex;gap:8px;margin:8px 0;"><input type="text" class="poll-option-input" placeholder="Вариант"><button class="btn-secondary" style="width:auto;padding:10px 14px;" onclick="removePollOption(this)">✕</button></div><div style="display:flex;gap:8px;margin:8px 0;"><input type="text" class="poll-option-input" placeholder="Вариант"><button class="btn-secondary" style="width:auto;padding:10px 14px;" onclick="removePollOption(this)">✕</button></div>';};
    window.closePoll=()=>document.getElementById('pollModal').classList.remove('active');
    window.addPollOption=()=>{const d=document.createElement('div');d.style.cssText='display:flex;gap:8px;margin:8px 0;';d.innerHTML='<input type="text" class="poll-option-input" placeholder="Вариант"><button class="btn-secondary" style="width:auto;padding:10px 14px;" onclick="removePollOption(this)">✕</button>';document.getElementById('pollOptionsContainer').appendChild(d);};
    window.removePollOption=(b)=>b.parentElement.remove();
    window.createPoll=async()=>{const q=document.getElementById('pollQuestion').value.trim();if(!q)return alert('Введите вопрос');const opts=Array.from(document.querySelectorAll('.poll-option-input')).map(i=>i.value.trim()).filter(t=>t);if(opts.length<2)return alert('Минимум 2 варианта');if(currentChat)await db.collection('chats').doc(currentChat.chatId).collection('messages').add({senderId:currentUser.uid,poll:{question:q,options:opts.map(t=>({text:t,votes:[]})),totalVotes:0},timestamp:firebase.firestore.FieldValue.serverTimestamp()});closePoll();};
    window.votePoll=async(mid,oi)=>{if(!currentChat)return;const ref=db.collection('chats').doc(currentChat.chatId).collection('messages').doc(mid);const d=await ref.get();if(!d.exists||!d.data().poll)return;const poll=d.data().poll;if(poll.options[oi].votes.includes(currentUser.uid))return alert('Уже голосовали');poll.options.forEach((o,i)=>{if(i!==oi)o.votes=o.votes.filter(u=>u!==currentUser.uid);});poll.options[oi].votes.push(currentUser.uid);poll.totalVotes=poll.options.reduce((s,o)=>s+o.votes.length,0);await ref.update({poll});};

    window.sendMsg=async(hidden=false)=>{const input=document.getElementById('msgInput');if(!input)return;const text=input.value.trim();if(!text||!currentChat)return;const isChannel=currentChat.otherUser.isChannel;const coll=isChannel?'posts':'messages';const msgData={senderId:currentUser.uid,text,timestamp:firebase.firestore.FieldValue.serverTimestamp()};if(hidden)msgData.hidden=true;if(replyingTo){msgData.replyTo=replyingTo;replyingTo=null;input.placeholder='Сообщение...';}await db.collection('chats').doc(currentChat.chatId).collection(coll).add(msgData);input.value='';};
    window.handleTyping=()=>{if(!currentChat)return;db.collection('chats').doc(currentChat.chatId).update({[`typing.${currentUser.uid}`]:true});clearTimeout(typingTimeout);typingTimeout=setTimeout(()=>{db.collection('chats').doc(currentChat.chatId).update({[`typing.${currentUser.uid}`]:false});},2000);};

    window.toggleTools=()=>{const p=document.getElementById('toolsPanel');if(p)p.classList.toggle('active');};
    window.sendMedia=()=>document.getElementById('mediaInput').click();
    window.sendFile=()=>document.getElementById('fileInput').click();
    window.handleMedia=async(e)=>{const file=e.target.files[0];if(!file||!currentChat)return;if(file.size>5*1024*1024){alert('Макс. 5MB');return;}const reader=new FileReader();reader.onload=async(ev)=>{const isVideo=file.type.startsWith('video');const coll=currentChat.otherUser.isChannel?'posts':'messages';await db.collection('chats').doc(currentChat.chatId).collection(coll).add({senderId:currentUser.uid,[isVideo?'video':'image']:ev.target.result,timestamp:firebase.firestore.FieldValue.serverTimestamp()});};reader.readAsDataURL(file);e.target.value='';};

    window.startCall=async()=>{if(!currentChat||callInProgress)return;const otherId=currentChat.otherUser.id;if(!otherId)return;endCall();try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});callInProgress=true;const callDocRef=db.collection('calls').doc();currentCallDocId=callDocRef.id;const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});peerConnections=[pc];localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=(e)=>{setupRemoteAudio(e.streams[0]);};pc.onicecandidate=(e)=>{if(e.candidate)callDocRef.update({candidates:firebase.firestore.FieldValue.arrayUnion(JSON.stringify(e.candidate))});};pc.onconnectionstatechange=()=>{const statusEl=document.getElementById('callStatus');if(statusEl){const state=pc.connectionState;statusEl.textContent={'connecting':'Подключение...','connected':'✅ Соединение установлено','disconnected':'⚠️ Разрыв','failed':'❌ Ошибка','closed':'Завершён'}[state]||state;}if(pc.connectionState==='failed'||pc.connectionState==='closed')endCall();};const offer=await pc.createOffer();await pc.setLocalDescription(offer);await callDocRef.set({participants:[currentUser.uid,otherId],callerId:currentUser.uid,status:'ringing',offer:JSON.stringify(offer),answer:null,candidates:[],maxParticipants:6,createdAt:firebase.firestore.FieldValue.serverTimestamp()});listenCallDoc(callDocRef);showCallUI([currentUser.uid]);_callTimeout=setTimeout(()=>{if(callInProgress&&pc.connectionState!=='connected'){alert('Не удалось установить соединение. Проверьте интернет.');endCall();}},25000);}catch(e){alert('Ошибка: '+e.message);endCall();}};

    async function joinCall(callId){endCall();try{localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});callInProgress=true;currentCallDocId=callId;const callRef=db.collection('calls').doc(callId);const data=(await callRef.get()).data();if((data.participants||[]).length>=(data.maxParticipants||6)){alert('Звонок заполнен (макс. 6)');endCall();return;}await callRef.update({participants:firebase.firestore.FieldValue.arrayUnion(currentUser.uid),status:'active'});const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});peerConnections=[pc];localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.ontrack=(e)=>{setupRemoteAudio(e.streams[0]);};pc.onicecandidate=(e)=>{if(e.candidate)callRef.update({candidates:firebase.firestore.FieldValue.arrayUnion(JSON.stringify(e.candidate))});};pc.onconnectionstatechange=()=>{const statusEl=document.getElementById('callStatus');if(statusEl){const state=pc.connectionState;statusEl.textContent={'connecting':'Подключение...','connected':'✅ Соединение установлено','disconnected':'⚠️ Разрыв','failed':'❌ Ошибка','closed':'Завершён'}[state]||state;}if(pc.connectionState==='failed'||pc.connectionState==='closed')endCall();};if(data.offer){await pc.setRemoteDescription(new RTCSessionDescription(JSON.parse(data.offer)));const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await callRef.update({answer:JSON.stringify(ans)});}listenCallDoc(callRef);showCallUI(data.participants||[]);_callTimeout=setTimeout(()=>{if(callInProgress&&pc.connectionState!=='connected'){alert('Не удалось установить соединение.');endCall();}},25000);}catch(e){endCall();}}
    function setupRemoteAudio(stream){const exist=document.getElementById('remoteAudio');if(exist)exist.remove();const a=document.createElement('audio');a.id='remoteAudio';a.autoplay=true;a.playsinline=true;a.srcObject=stream;a.play().catch(()=>{});const m=document.getElementById('callModal');if(m)m.appendChild(a);}
    function listenCallDoc(ref){if(callDocListener)callDocListener();callDocListener=ref.onSnapshot(async(doc)=>{if(!doc.exists){endCall();return;}const data=doc.data();if(data.status==='ended'){endCall();return;}updateCallParticipants(data.participants||[]);if(data.answer&&peerConnections[0]&&data.callerId!==currentUser.uid){try{if(!peerConnections[0].remoteDescription)await peerConnections[0].setRemoteDescription(new RTCSessionDescription(JSON.parse(data.answer)));}catch(e){}}if(data.candidates&&peerConnections[0]?.remoteDescription){const existingCandidates=new Set();for(const c of data.candidates){try{const cand=new RTCIceCandidate(JSON.parse(c));if(!existingCandidates.has(cand.candidate)){existingCandidates.add(cand.candidate);await peerConnections[0].addIceCandidate(cand);}}catch(e){}}}});}
    window.endCall=()=>{if(_callTimeout){clearTimeout(_callTimeout);_callTimeout=null;}if(currentCallDocId)db.collection('calls').doc(currentCallDocId).update({status:'ended'}).catch(()=>{});if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}peerConnections.forEach(pc=>{pc.close();});peerConnections=[];if(callDocListener){callDocListener();callDocListener=null;}callInProgress=false;currentCallDocId=null;_micMuted=false;_speakerMuted=false;closeCallUI();};
    function showCallUI(participants){closeCallUI();const name=currentChat?.otherUser?.displayName||'Звонок';const modal=document.createElement('div');modal.id='callModal';modal.className='call-modal';modal.innerHTML=`<div class="call-avatar-ring">${name.charAt(0).toUpperCase()}</div><div class="call-name">${name}</div><div class="call-status" id="callStatus">Подключение...</div><div class="call-timer" id="callTimer" style="display:none;">00:00</div><div class="call-participants" id="callParticipants">${(participants||[]).slice(0,6).map(()=>'<div class="call-participant">👤</div>').join('')}</div><button class="call-invite-btn" onclick="copyCallLink()">🔗 Копировать ссылку</button><div class="call-actions"><button class="call-btn-circle call-btn-mute" id="muteMicBtn" onclick="toggleMic()">🎙️</button><button class="call-btn-circle call-btn-end" onclick="window.endCall()">📞</button><button class="call-btn-circle call-btn-speaker" id="muteSpeakerBtn" onclick="toggleSpeaker()">🔊</button></div>`;document.body.appendChild(modal);callStartTime=Date.now();callTimerInterval=setInterval(updateCallTimer,1000);}
    function updateCallParticipants(participants){const c=document.getElementById('callParticipants');if(!c)return;c.innerHTML=participants.slice(0,6).map(()=>'<div class="call-participant">👤</div>').join('');}
    function updateCallTimer(){const t=document.getElementById('callTimer'),s=document.getElementById('callStatus');if(!t||!s)return;if(peerConnections[0]?.connectionState==='connected'){t.style.display='block';s.style.display='none';const el=Math.floor((Date.now()-callStartTime)/1000);t.textContent=`${Math.floor(el/60).toString().padStart(2,'0')}:${(el%60).toString().padStart(2,'0')}`;}}
    window.copyCallLink=()=>{if(!currentCallDocId)return;const link=getCallInviteLink(currentCallDocId);navigator.clipboard.writeText(link).then(()=>alert('Ссылка скопирована!')).catch(()=>prompt('Ссылка:',link));};
    window.toggleMic=()=>{_micMuted=!_micMuted;if(localStream)localStream.getAudioTracks().forEach(t=>t.enabled=!_micMuted);const b=document.getElementById('muteMicBtn');if(b){b.classList.toggle('muted',_micMuted);b.textContent=_micMuted?'🔇':'🎙️';}};
    window.toggleSpeaker=()=>{_speakerMuted=!_speakerMuted;const a=document.getElementById('remoteAudio');if(a)a.muted=_speakerMuted;const b=document.getElementById('muteSpeakerBtn');if(b){b.classList.toggle('muted',_speakerMuted);b.textContent=_speakerMuted?'🔇':'🔊';}};
    function closeCallUI(){const m=document.getElementById('callModal');if(m)m.remove();const n=document.getElementById('incomingCallNotification');if(n)n.remove();const a=document.getElementById('remoteAudio');if(a)a.remove();if(callTimerInterval){clearInterval(callTimerInterval);callTimerInterval=null;}callStartTime=null;}
    function checkCallLink(){const params=new URLSearchParams(window.location.search);const callId=params.get('call');if(callId&&currentUser){if(confirm('Вас приглашают в звонок. Присоединиться?'))joinCall(callId);window.history.replaceState({},'',window.location.pathname);}}

    window.openChangePhone=()=>{document.getElementById('changePhoneModal').classList.add('active');};
    window.closeChangePhone=()=>document.getElementById('changePhoneModal').classList.remove('active');
    window.verifyCode=()=>{alert('Функция в разработке');};
    window.requestNewCode=()=>{alert('Новый код отправлен');};
    window.confirmNewPhone=async()=>{const phone='+7'+document.getElementById('newPhone').value.trim();if(!phone)return alert('Введите номер');await db.collection('users').doc(currentUser.uid).update({phone});currentUserProfile.phone=phone;document.getElementById('profilePhone').textContent=phone;closeChangePhone();};

    auth.onAuthStateChanged(async user=>{if(user){currentUser=user;const d=await db.collection('users').doc(user.uid).get();currentUserProfile=d.exists?d.data():{displayName:user.email.split('@')[0],bio:'',photoURL:'',mode:'online'};await ensureSystemChats(user.uid);document.getElementById('authScreen').classList.remove('active');document.getElementById('app').classList.add('active');startPresence();loadSystemList();listenChats();listenForIncomingCalls();setupTestBotCallHandler();checkCallLink();}else{currentUser=null;document.getElementById('authScreen').classList.add('active');document.getElementById('app').classList.remove('active');stopPresence();endCall();}});
  </script>
